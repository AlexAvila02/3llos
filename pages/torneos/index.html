<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Torneos - Calipso</title>
  <link rel="stylesheet" href="../../css/main.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: #0a0a1a;
      color: white;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 15vh;
    }

    .torneo-bg {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background:
        radial-gradient(ellipse at 20% 50%, rgba(255, 100, 0, 0.06) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 20%, rgba(160, 80, 247, 0.06) 0%, transparent 60%);
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 700px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    .back-btn {
      display: inline-block;
      padding: 8px 20px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 50px;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.7);
      text-decoration: none;
      transition: all 0.3s ease;
      margin-bottom: 30px;
    }

    .back-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      color: white;
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .header h1 {
      font-size: 42px;
      font-weight: 800;
      letter-spacing: 3px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #ff6400, #ffaa00, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .header p {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.4);
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-top: 8px;
    }

    .torneos-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .torneo-link {
      display: block;
      padding: 24px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      text-decoration: none;
      transition: all 0.3s ease;
    }

    .torneo-link:hover {
      background: rgba(255, 255, 255, 0.08);
      transform: translateY(-2px);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .torneo-link h2 {
      font-size: 20px;
      font-weight: 700;
      color: white;
      margin-bottom: 6px;
    }

    .torneo-link .torneo-meta {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.4);
    }

    .torneo-link .torneo-meta span {
      color: rgba(255, 255, 255, 0.6);
    }

    .top-promedio-btn {
      display: block;
      width: fit-content;
      margin: 8px auto;
      padding: 10px 28px;
      background: linear-gradient(135deg, rgba(255, 170, 0, 0.25), rgba(160, 80, 247, 0.25));
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 170, 0, 0.3);
      border-radius: 50px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 2px;
      color: white;
      text-decoration: none;
      text-transform: uppercase;
      text-align: center;
      transition: all 0.3s ease;
    }

    .top-promedio-btn:hover {
      background: linear-gradient(135deg, rgba(255, 170, 0, 0.4), rgba(160, 80, 247, 0.4));
      transform: translateY(-2px);
      border-color: rgba(255, 170, 0, 0.5);
      box-shadow: 0 4px 15px rgba(255, 170, 0, 0.2);
    }

    .footer-note {
      text-align: center;
      margin-top: 50px;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.25);
      letter-spacing: 2px;
    }
  </style>
</head>
<body>
  <div class="torneo-bg"></div>

  <div class="container">
    <a href="../../index.html" class="back-btn">&#8592; Volver</a>

    <div class="header">
      <h1>Torneos</h1>
      <p>Historial de enfrentamientos</p>
    </div>

    <div class="torneos-list">
      <a href="torneo-calipso.html" class="torneo-link">
        <h2>Torneo Calipso Ida</h2>
        <p class="torneo-meta">Eq 2 (LauritaAmorosa) vs Eq 1 (Elfic Ticio) &middot; <span>43-21 &middot; Eq 2 gana</span></p>
      </a>
      <a href="top-promedio.html" class="top-promedio-btn">Top Promedio</a>
      <a href="torneo-calipso-revancha.html" class="torneo-link">
        <h2>Torneo Calipso Vuelta</h2>
        <p class="torneo-meta">LauritaAmorosa vs Elfic Ticio &middot; <span>Eq 1 gana</span></p>
      </a>
    </div>

    <p class="footer-note">PAPUBANDA 2026</p>
  </div>
</body>
</html>
