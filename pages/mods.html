<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mods - Papubanda</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
html{zoom:1.2}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Press Start 2P',monospace;
  background:
    linear-gradient(#6db6ff 0 42%, #7ac74f 42% 44%, #8b5a2b 44% 46%, #6b4423 46% 100%);
  min-height:100vh;color:#fff;padding:24px;
  image-rendering:pixelated;
  position:relative;
}
body::after{
  content:'';position:fixed;inset:0;
  background-image:
    linear-gradient(rgba(0,0,0,.07) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,0,0,.07) 1px, transparent 1px);
  background-size:16px 16px;
  pointer-events:none;opacity:.25;z-index:-1;
}
body::before{
  content:'';position:fixed;inset:0;
  background:
    linear-gradient(rgba(0,0,0,.18),rgba(0,0,0,.18)),
    repeating-linear-gradient(0deg,rgba(0,0,0,.06) 0 2px,transparent 2px 4px);
  pointer-events:none;z-index:-1;
}
.clouds{position:absolute;top:0;left:0;width:100%;height:320px;overflow:hidden;pointer-events:none;z-index:0}
.cloud{
  position:absolute;top:0;
  width:96px;height:32px;
  background:#fff;
  box-shadow:
    16px 0 0 #fff, 32px 0 0 #fff, 48px 0 0 #fff,
    8px 8px 0 #fff, 24px 8px 0 #fff, 40px 8px 0 #fff, 56px 8px 0 #fff,
    0 16px 0 #e8e8e8, 16px 16px 0 #e8e8e8, 32px 16px 0 #e8e8e8, 48px 16px 0 #e8e8e8, 64px 16px 0 #e8e8e8,
    8px 24px 0 #d6d6d6, 24px 24px 0 #d6d6d6, 40px 24px 0 #d6d6d6;
  image-rendering:pixelated;
  opacity:.9;
  animation:drift linear infinite;
}
.cloud:nth-child(1){top:18px;animation-duration:55s;animation-delay:-5s;scale:.9}
.cloud:nth-child(2){top:58px;animation-duration:70s;animation-delay:-22s;scale:1.1}
.cloud:nth-child(3){top:38px;animation-duration:62s;animation-delay:-38s;scale:.8}
.cloud:nth-child(4){top:78px;animation-duration:80s;animation-delay:-48s;scale:1}
@keyframes drift{from{transform:translateX(-140px)}to{transform:translateX(110vw)}}
a{color:inherit}
.back{
  position:fixed;top:14px;left:14px;text-decoration:none;
  background:#8b8b8b;border:3px solid #373737;border-right-color:#fff;border-bottom-color:#fff;
  padding:8px 12px;font-size:9px;color:#fff;box-shadow:2px 2px 0 #000;
}
.header{max-width:920px;margin:0 auto 22px;text-align:center;text-shadow:3px 3px 0 #3a3a3a, 0 0 10px rgba(0,0,0,.6)}
.header h1{font-size:22px;line-height:1.4;letter-spacing:1px}
.header h1 span{color:#55ff55}
.header p{font-size:8px;margin-top:10px;line-height:2.1;background:rgba(0,0,0,.38);display:inline-block;padding:6px 12px;border-radius:8px;backdrop-filter:blur(4px)}
.mc-panel{
  max-width:920px;margin:0 auto 16px;
  background:#c6c6c6;border:4px solid #000;
  box-shadow:inset -4px -4px 0 #555, inset 4px 4px 0 #fff, 4px 4px 0 rgba(0,0,0,.5);
  padding:12px;
}
.toolbar{display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.count{font-size:12px;color:#373737}
.btn-mc{
  font-family:'Press Start 2P',monospace;font-size:8px;
  background:#8b8b8b;color:#fff;
  border:3px solid #000; border-top-color:#fff; border-left-color:#fff;
  padding:10px 12px;cursor:pointer;
  box-shadow:inset -2px -2px 0 #555, inset 2px 2px 0 #fff;
  text-shadow:1px 1px 0 #373737;
}
.btn-mc:hover{background:#9a9a9a}
.btn-mc:active{border-color:#373737;box-shadow:inset 2px 2px 0 #555;transform:translate(1px,1px)}
.btn-mc.green{background:#5aaa3a;border-color:#2d631d;border-top-color:#8be07a;border-left-color:#8be07a}
.btn-mc.green:hover{background:#6fbf4a}
.folder{font-size:7px;color:#373737;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:#fff;border:2px solid #373737;padding:4px 6px;box-shadow:inset 2px 2px 0 #8b8b8b}
.grid{max-width:920px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{
  background:#c6c6c6;border:3px solid #000;
  box-shadow:inset -3px -3px 0 #555, inset 3px 3px 0 #fff;
  padding:12px;display:flex;flex-direction:column;gap:8px;
  position:relative;
}
.card::before{content:'⬢';position:absolute;top:6px;right:8px;font-size:10px;color:#5aaa3a;text-shadow:1px 1px 0 #000}
.card h3{font-size:9px;color:#373737;word-break:break-all;line-height:1.5;min-height:26px}
.meta{font-size:7px;color:#5a5a5a}
.mc-inv{
  background:#8b8b8b;border:2px solid #373737;box-shadow:inset 2px 2px 0 #fff, inset -2px -2px 0 #555;
  padding:6px;display:flex;align-items:center;gap:8px;
}
.mc-inv .slot{
  width:28px;height:28px;background:#8b8b8b;border:2px solid #373737;
  box-shadow:inset 2px 2px 0 #373737, inset -2px -2px 0 #fff;
  display:grid;place-items:center;font-size:14px;
}
.download-mc{
  font-family:'Press Start 2P',monospace;font-size:8px;
  background:#5aaa3a;color:#fff;text-decoration:none;text-align:center;
  padding:10px;border:3px solid #2d631d;border-top-color:#8be07a;border-left-color:#8be07a;
  box-shadow:inset -2px -2px 0 #2d631d, 2px 2px 0 #000;
  text-shadow:1px 1px 0 #2d631d;
}
.download-mc:hover{background:#6fbf4a}
.download-mc:active{transform:translate(1px,1px)}
.state{
  max-width:920px;margin:24px auto;text-align:center;
  background:#c6c6c6;border:3px solid #000;box-shadow:inset -3px -3px 0 #555, inset 3px 3px 0 #fff, 3px 3px 0 rgba(0,0,0,.4);
  padding:16px;font-size:9px;color:#373737;line-height:1.6
}
.error{color:#9b0000}
.search{font-family:'Press Start 2P',monospace;font-size:7px;padding:8px;border:3px solid #373737;box-shadow:inset 2px 2px 0 #8b8b8b;background:#fff;color:#373737;min-width:180px}
.search::placeholder{color:#8b8b8b}
.card.sel{outline:3px solid #55ff55;outline-offset:-3px}
.cb{width:18px;height:18px;accent-color:#5aaa3a;cursor:pointer}
.sel-bar{max-width:920px;margin:0 auto 10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;background:#c6c6c6;border:3px solid #000;box-shadow:inset -2px -2px 0 #555, inset 2px 2px 0 #fff;padding:8px}
.badge{display:inline-block;font-size:6px;padding:3px 6px;border:2px solid #000;box-shadow:2px 2px 0 rgba(0,0,0,.4);margin-bottom:4px}
.badge-obl{background:#5aaa3a;color:#fff;border-color:#2d631d}
.badge-opt{background:#f7d51d;color:#373737;border-color:#8a6d00}
.badge-srv{background:#8b8b8b;color:#fff;border-color:#373737}
.filter-bar{max-width:920px;margin:0 auto 10px;display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.filter-bar .btn-mc.active{background:#fff;color:#373737;border-color:#373737;box-shadow:inset 2px 2px 0 #555}
.zip-modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:9999}
.zip-modal.active{display:flex}
.zip-box{background:#c6c6c6;border:4px solid #000;box-shadow:inset -4px -4px 0 #555,inset 4px 4px 0 #fff,6px 6px 0 rgba(0,0,0,.5);padding:16px;max-width:420px;width:90%;text-align:center}
.zip-bar{height:18px;background:#8b8b8b;border:3px solid #000;box-shadow:inset 2px 2px 0 #373737;position:relative;overflow:hidden;margin:10px 0}
.zip-fill{height:100%;background:linear-gradient(90deg,#5aaa3a,#7bd555);width:0%;transition:width .25s;box-shadow:inset 0 2px 0 rgba(255,255,255,.4)}
.zip-text{font-size:7px;color:#373737;line-height:1.6;word-break:break-all}
.grass-bar{height:14px;background:repeating-linear-gradient(90deg,#5aaa3a 0 16px,#4a962f 16px 32px);border:3px solid #2d631d;box-shadow:2px 2px 0 #000;margin:0 auto 14px;max-width:920px}
</style>
</head>
<body>
<div class="clouds"><div class="cloud"></div><div class="cloud"></div><div class="cloud"></div><div class="cloud"></div></div>
<a class="back" href="../index.html">‹ INICIO</a>
<div class="header">
<h1>◼ <span>MODS</span> DEL SERVIDOR ◼</h1>
<p>◆ Sincronizado en tiempo real desde Minehost / Pterodactyl ◆<br>Coloca los .jar en /mods y dale a Actualizar</p>
</div>
<div id="mc-widget" class="mc-widget-mc">
  <div class="mcw-head">
    <span class="mc-dot" id="mc-dot"></span>
    <span id="mc-status">Consultando...</span>
    <span id="mc-players" style="margin-left:auto;font-size:7px"></span>
  </div>
  <div class="mcw-ip">
    <span id="mc-ip" style="flex:1;font-size:8px;overflow:hidden;text-overflow:ellipsis">sv21.minehost.pro:25476</span>
    <button class="btn-mc green" id="mc-copy" onclick="copyMcIp()" style="font-size:7px;padding:6px 8px">⎘ COPIAR IP</button>
  </div>
</div>
<style>.mc-widget-mc{max-width:920px;margin:0 auto 14px;background:#c6c6c6;border:4px solid #000;box-shadow:inset -4px -4px 0 #555,inset 4px 4px 0 #fff,4px 4px 0 rgba(0,0,0,.5);padding:10px}
.mcw-head{display:flex;align-items:center;gap:8px;font-size:8px;color:#373737}
.mc-dot{width:12px;height:12px;border:2px solid #000;box-shadow:inset 1px 1px 0 #fff;background:#555}
.mc-dot.online{background:#2ecc71;box-shadow:0 0 6px #2ecc71, inset 1px 1px 0 #fff}
.mc-dot.offline{background:#e74c3c;box-shadow:0 0 6px #e74c3c, inset 1px 1px 0 #fff}
.mcw-ip{margin-top:8px;display:flex;gap:8px;align-items:center;background:#8b8b8b;border:2px solid #373737;box-shadow:inset 2px 2px 0 #fff, inset -2px -2px 0 #555;padding:6px}
</style>
<div class="grass-bar"></div>
<div class="mc-panel">
<div class="toolbar">
<span id="count" class="count"></span>
<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
<input id="search" class="search" placeholder="BUSCAR MOD..." oninput="render()">
<button class="btn-mc" id="pickFolderBtn" onclick="pickFolder()">📁 CARPETA</button>
<span id="folderName" class="folder" style="display:none"></span>
<button class="btn-mc green" onclick="downloadZipServer()" id="zipBtn">📦 .ZIP</button>
<button class="btn-mc" onclick="loadMods()">↻ ACTUALIZAR</button>
</div>
</div>
</div>
<div class="filter-bar" id="filterBar">
<button class="btn-mc" data-f="todos" onclick="setFilter('todos')">TODOS</button>
<button class="btn-mc active" data-f="necesarios" onclick="setFilter('necesarios')">OBLIGATORIOS</button>
<button class="btn-mc" data-f="opcional" onclick="setFilter('opcional')">OPCIONALES</button>
<button class="btn-mc" data-f="servidor" onclick="setFilter('servidor')">SOLO SERVIDOR</button>
</div>
<div class="sel-bar" id="selBar" style="display:none">
<div style="display:flex;gap:8px;align-items:center">
<button class="btn-mc" onclick="selectAll(true)">☑ TODOS</button>
<button class="btn-mc" onclick="selectAll(false)">☐ NINGUNO</button>
<span class="count" id="selCount" style="display:flex;align-items:center;gap:6px;font-size:14px"><span style="font-size:16px">📦</span>.JAR <span id="selNum">0</span> <span id="selDetail" style="font-size:12px;opacity:.8"></span></span>
</div>
<button class="btn-mc green" onclick="downloadSelected()" id="dlSelBtn" style="display:flex;align-items:center;gap:6px"><span style="font-size:14px">📦</span> .JAR (<span id="dlNum">0</span>)</button>
</div>
<div id="zipModal" class="zip-modal" onclick="if(event.target===this) cancelZip()">
<div class="zip-box">
<div style="font-size:9px;color:#373737;margin-bottom:6px">⬢ GENERANDO ZIP ⬢</div>
<div id="zipStatus" class="zip-text">Preparando descarga...</div>
<div class="zip-bar"><div id="zipFill" class="zip-fill"></div></div>
<div id="zipPct" class="zip-text">0%</div>
<button class="btn-mc" onclick="cancelZip()" style="margin-top:8px">✕ CANCELAR</button>
</div>
</div>
<div id="progress" class="state" style="display:none"></div>
<div id="state" class="state">Cargando mods...</div>
<div id="grid" class="grid" style="display:none"></div>
<script>
const SERVER_KW=['chunky','ftbbackups','ftb-ranks','ftb-essentials','spark','skinrestorer','daytimecontrol','madeinsleep'];
const OPTIONAL_KW=['xaerominimap','xaeroworldmap','mousetweaks','jade','enhanced_boss_bars','emotecraft'];
function classify(filename){
  const n=filename.toLowerCase();
  if(SERVER_KW.some(k=>n.includes(k))) return 'servidor';
  if(OPTIONAL_KW.some(k=>n.includes(k))) return 'opcional';
  return 'obligatorio';
}
function badgeHtml(type){
  if(type==='servidor') return '<span class="badge badge-srv">[ SERVIDOR ]</span>';
  if(type==='opcional') return '<span class="badge badge-opt">[ OPCIONAL ]</span>';
  return '<span class="badge badge-obl">[ OBLIGATORIO ]</span>';
}
let currentFilter='necesarios';
function setFilter(f){
  currentFilter=f;
  document.querySelectorAll('#filterBar .btn-mc').forEach(b=>b.classList.toggle('active', b.dataset.f===f));
  render();
}
function passesFilter(type){
  if(currentFilter==='todos') return true;
  if(currentFilter==='necesarios') return type==='obligatorio';
  return type===currentFilter;
}
function getClientMods(){ return cachedMods.filter(m=> classify(m.filename)!=='servidor'); }
let selected=new Set();
function render(){
  const grid=document.getElementById('grid');
  const count=document.getElementById('count');
  const state=document.getElementById('state');
  const q=(document.getElementById('search').value||'').toLowerCase().trim();
  let filtered=cachedMods.filter(m=>!q||m.name.toLowerCase().includes(q)||m.filename.toLowerCase().includes(q));
  filtered=filtered.filter(m=> passesFilter(classify(m.filename)));
  if(!filtered.length){
    grid.style.display='none';
    if(cachedMods.length) { state.style.display='block'; state.textContent='Sin resultados para "'+q+'"'; }
    count.textContent=cachedMods.length+' MODS';
    document.getElementById('selBar').style.display=cachedMods.length?'flex':'none';
    updateSel();
    return;
  }
  state.style.display='none'; grid.style.display='grid';
  grid.innerHTML=filtered.map(m=>{
    const sel=selected.has(m.filename);
    const type=classify(m.filename);
    return `<div class="card ${sel?'sel':''}">
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer"><input type="checkbox" class="cb" ${sel?'checked':''} onchange="toggleSel('${m.filename.replace(/'/g,"\\'")}')"><h3 style="flex:1">${m.name}</h3></label>
        ${badgeHtml(type)}
        <div class="mc-inv"><div class="slot">📦</div><span class="meta">${m.filename}<br>${m.size}</span></div>
        <a class="download-mc" href="#" onclick="downloadOne('${m.filename.replace(/'/g,"\\'")}');return false">DESCARGAR</a>
      </div>`;
  }).join('');
  count.textContent=filtered.length+' / '+cachedMods.length+' MODS';
  document.getElementById('selBar').style.display='flex';
  updateSel();
}
function toggleSel(f){ if(selected.has(f)) selected.delete(f); else selected.add(f); render(); }
function selectAll(v){
  const q=(document.getElementById('search').value||'').toLowerCase().trim();
  let filtered=cachedMods.filter(m=>!q||m.name.toLowerCase().includes(q)||m.filename.toLowerCase().includes(q));
  filtered=filtered.filter(m=> passesFilter(classify(m.filename)));
  if(v){
    const clientFiltered=filtered.filter(m=> classify(m.filename)!=='servidor');
    const toAdd = clientFiltered.length ? clientFiltered : filtered;
    toAdd.forEach(m=> selected.add(m.filename));
  } else {
    filtered.forEach(m=> selected.delete(m.filename));
  }
  render();
}
function updateSel(){
  const n=selected.size;
  const sn=document.getElementById('selNum'); if(sn) sn.textContent=n;
  const dn=document.getElementById('dlNum'); if(dn) dn.textContent=n;
  document.getElementById('dlSelBtn').style.display=n?'flex':'none';
  const det=document.getElementById('selDetail');
  if(det){
    const clientCount=getClientMods().length;
    if(n>0 && n===clientCount){
      const obl=[...selected].filter(f=>classify(f)==='obligatorio').length;
      const opt=[...selected].filter(f=>classify(f)==='opcional').length;
      det.textContent=`(${obl} oblig + ${opt} opc)`;
    } else if(n>0){
      const obl=[...selected].filter(f=>classify(f)==='obligatorio').length;
      const opt=[...selected].filter(f=>classify(f)==='opcional').length;
      if(obl||opt) det.textContent=`(${obl} oblig + ${opt} opc)`;
      else det.textContent='';
    } else det.textContent='';
  }
}
async function downloadSelected(){
  const list=[...selected];
  if(!list.length) return alert('Selecciona al menos 1 mod');
  if(dirHandle){
    const perm=await dirHandle.requestPermission({mode:'readwrite'});
    if(perm!=='granted'){ alert('No se otorgaron permisos de escritura en la carpeta.'); return; }
    const prog=document.getElementById('progress');
    prog.style.display='block';
    const listaMods=list.map(fn=> cachedMods.find(m=>m.filename===fn)).filter(Boolean);
    const modsAInstalar=listaMods;
    for(let i=0;i<modsAInstalar.length;i++){
      const mod=modsAInstalar[i];
      prog.textContent=`Instalando ${i+1}/${modsAInstalar.length}: ${mod.name}...`;
      try{ await guardarModEnDisco(dirHandle, mod); }catch(err){
        console.warn(`Reintentando ${mod.filename} por bloqueo de disco...`);
        try{ await new Promise(r=>setTimeout(r,300)); await guardarModEnDisco(dirHandle, mod); }catch(retryErr){ console.error(`Error definitivo con ${mod.filename}:`,retryErr); }
      }
    }
    prog.textContent='¡Todos los mods se guardaron correctamente en la carpeta! ✓';
    setTimeout(()=>prog.style.display='none',3500);
    return;
  }
  if(!confirm('Descargar '+list.length+' mods?')) return;
  for(const f of list){ fallbackDownload(f); await new Promise(r=>setTimeout(r,600)); }
}
async function loadMods(){
  const state=document.getElementById('state');
  const grid=document.getElementById('grid');
  const count=document.getElementById('count');
  state.style.display='block'; state.textContent='Cargando mods...'; state.className='state';
  grid.style.display='none'; grid.innerHTML='';
  try{
    const res=await fetch('/api/mods');
    if(!res.ok){
      const j=await res.json().catch(()=>({error:res.statusText}));
      throw new Error(j.error||j.details||res.statusText);
    }
    const mods=await res.json();
    cachedMods=Array.isArray(mods)?mods:[];
    selected.clear();
    if(!Array.isArray(mods)||mods.length===0){
      state.textContent='No hay mods instalados';
      count.textContent='';
      const zb=document.getElementById('zipBtn'); if(zb) zb.style.display='none';
      document.getElementById('selBar').style.display='none';
      return;
    }
    const zb2=document.getElementById('zipBtn'); if(zb2) zb2.style.display='';
    render();
  }catch(e){
    state.textContent='Error: '+e.message;
    state.className='state error';
    count.textContent='';
  }
}
let cachedMods=[];
let dirHandle=null;
async function pickFolder(){
  if(!window.showDirectoryPicker){ alert('Tu navegador no soporta elegir carpeta (usa Chrome/Edge). Se usara Descargas.'); return; }
  try{
    dirHandle=await window.showDirectoryPicker({mode:'readwrite'});
    const el=document.getElementById('folderName'); el.textContent='📁 '+dirHandle.name; el.style.display='block'; el.style.color='#2d631d';
    const btn=document.getElementById('pickFolderBtn'); if(btn){ btn.textContent='✓ CARPETA LISTA'; btn.classList.add('green'); }
    const perm=await dirHandle.requestPermission({mode:'readwrite'});
    if(perm!=='granted'){ dirHandle=null; if(btn){ btn.textContent='📁 CARPETA'; btn.classList.remove('green'); } el.style.display='none'; }
  }catch(e){ if(e.name!=='AbortError') alert(e.message); }
}
async function ensureFolder(){
  if(dirHandle) return true;
  if(window.showDirectoryPicker){
    const want=confirm('Elige la carpeta donde guardar los mods.\n¿Elegir ahora?');
    if(want){ await pickFolder(); return !!dirHandle; }
  }
  return false;
}
async function saveToFolder(filename, blob){
  if(!dirHandle) return false;
  try{
    const fh=await dirHandle.getFileHandle(filename,{create:true});
    const w=await fh.createWritable({keepExistingData:false}); await w.write(blob); await w.close(); return true;
  }catch(e){ alert('Error guardando '+filename+': '+e.message); return false; }
}
async function fetchModBlob(filename){
  const res=await fetch(`/api/download-mod?file=${encodeURIComponent(filename)}`);
  if(!res.ok) throw new Error('Error al descargar: '+res.status);
  return await res.blob();
}
function fallbackDownload(filename){
  const a=document.createElement('a'); a.href='/api/download-mod?file='+encodeURIComponent(filename); a.download=filename;
  document.body.appendChild(a); a.click(); a.remove();
}
async function guardarModEnDisco(dirHandle, mod){
  try{ await dirHandle.removeEntry(mod.filename); }catch(e){}
  const res=await fetch(`/api/download-mod?file=${encodeURIComponent(mod.filename)}`);
  if(!res.ok) throw new Error(`HTTP ${res.status}`);
  const blob=await res.blob();
  const fileHandle=await dirHandle.getFileHandle(mod.filename,{create:true});
  const writable=await fileHandle.createWritable({keepExistingData:false});
  await writable.write(blob);
  await writable.close();
  await new Promise(resolve=>setTimeout(resolve,100));
}
function fallbackDownload(filename){

      method:'POST',

    });
    if(!res.ok){ const j=await res.json().catch(async()=>({error:await res.text()})); throw new Error(j.error||j.details||JSON.stringify(j)); }

async function downloadZipClientFallback(){
  const list=getClientMods();
  if(!list.length) return;
  const modal=document.getElementById('zipModal');
  const status=document.getElementById('zipStatus');
  const fill=document.getElementById('zipFill');
  const pct=document.getElementById('zipPct');
  modal.classList.add('active');
  status.textContent='Servidor ocupado, generando ZIP local...';
  const zip=new JSZip(); let done=0, idx=0; const total=list.length;
  const queue=[...list];
  async function worker(){
    while(queue.length && !zipCancelled){
      const mod=queue.shift(); const cur=++idx;
      status.textContent='Descargando '+mod.filename+' ('+cur+'/'+total+')';
      try{ const b=await fetchModBlob(mod.filename); zip.file(mod.filename,b);}catch(e){}
      done++; const p=Math.round(done/total*85); fill.style.width=p+'%'; pct.textContent=p+'%';
    }
  }
  await Promise.all(Array(4).fill(0).map(()=>worker()));
  if(zipCancelled) return;
  status.textContent='Comprimiendo...'; pct.textContent='90%'; fill.style.width='90%';
  const content=await zip.generateAsync({type:'blob', compression:'STORE', mimeType:'application/zip'});
  const blob=new Blob([content],{type:'application/zip'});
  if(dirHandle){
    const fh=await dirHandle.getFileHandle('mods.zip',{create:true});
    const w=await fh.createWritable(); await w.write(blob); await w.close();
    status.textContent='¡ZIP en '+dirHandle.name+'/mods.zip ✓';
  } else {
    const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download='mods-servidor.zip'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),5000);
    status.textContent='✓ ZIP local listo';
  }
  fill.style.width='100%'; pct.textContent='100%';
  setTimeout(()=>modal.classList.remove('active'),1500);
}
async function downloadZipServerLegacy(){
  const list=getClientMods();
  if(!list.length) return alert('No hay mods cliente');
  zipCancelled=false;
  const modal=document.getElementById('zipModal');
  const status=document.getElementById('zipStatus');
  const fill=document.getElementById('zipFill');
  const pct=document.getElementById('zipPct');
  modal.classList.add('active');
  status.textContent='Preparando descarga...'; fill.style.width='0%'; pct.textContent='0%';
  const zip=new JSZip();
  const total=list.length;
  let done=0;
  const concurrency=4;
  let idx=0;
  async function fetchWithRetry(filename){
    for(let attempt=0;attempt<2;attempt++){
      try{
        const r=await fetch('/api/download-mod?file='+encodeURIComponent(filename));
        if(!r.ok) throw new Error(r.statusText);
        return await r.blob();
      }catch(e){ if(attempt===1) throw e; await new Promise(rr=>setTimeout(rr,400)); }
    }
  }
  const queue=[...list];
  async function worker(){
    while(queue.length && !zipCancelled){
      const mod=queue.shift();
      const cur=++idx;
      status.textContent='Descargando '+mod.filename+' ('+cur+' / '+total+')';
      try{
        const blob=await fetchWithRetry(mod.filename);
        zip.file(mod.filename, blob);
      }catch(e){ console.warn('skip',mod.filename,e); }
      done++;
      const p=Math.round(done/total*85);
      fill.style.width=p+'%'; pct.textContent=p+'%';
    }
  }
  const workers=Array(Math.min(concurrency,total)).fill(0).map(()=>worker());
  await Promise.all(workers);
  if(zipCancelled){ status.textContent='Cancelado'; fill.style.width='0%'; return; }
  status.textContent='Comprimiendo archivo ZIP final...'; pct.textContent='90%'; fill.style.width='90%';
  try{
    const content=await zip.generateAsync({type:'blob', compression:'STORE', mimeType:'application/zip'});
    fill.style.width='100%'; pct.textContent='100%'; status.textContent='✓ ZIP listo';
    const url=URL.createObjectURL(new Blob([content],{type:'application/zip'}));
    const a=document.createElement('a'); a.href=url; a.download='mods-servidor.zip'; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),5000);
    setTimeout(()=>modal.classList.remove('active'),1500);
  }catch(e){
    status.textContent='Error: '+e.message; alert('Error comprimiendo: '+e.message);
  }
}
