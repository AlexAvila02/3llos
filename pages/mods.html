<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mods - Papubanda</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
html{zoom:1.2}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Press Start 2P',monospace;
  background:
    linear-gradient(#6db6ff 0 42%, #7ac74f 42% 44%, #8b5a2b 44% 46%, #6b4423 46% 100%);
  min-height:100vh;color:#fff;padding:24px;
  image-rendering:pixelated;
  position:relative;
}
body::after{
  content:'';position:fixed;inset:0;
  background-image:
    linear-gradient(rgba(0,0,0,.07) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,0,0,.07) 1px, transparent 1px);
  background-size:16px 16px;
  pointer-events:none;opacity:.25;z-index:-1;
}
body::before{
  content:'';position:fixed;inset:0;
  background:
    linear-gradient(rgba(0,0,0,.18),rgba(0,0,0,.18)),
    repeating-linear-gradient(0deg,rgba(0,0,0,.06) 0 2px,transparent 2px 4px);
  pointer-events:none;z-index:-1;
}
.clouds{position:absolute;top:0;left:0;width:100%;height:320px;overflow:hidden;pointer-events:none;z-index:0}
.cloud{
  position:absolute;top:0;
  width:96px;height:32px;
  background:#fff;
  box-shadow:
    16px 0 0 #fff, 32px 0 0 #fff, 48px 0 0 #fff,
    8px 8px 0 #fff, 24px 8px 0 #fff, 40px 8px 0 #fff, 56px 8px 0 #fff,
    0 16px 0 #e8e8e8, 16px 16px 0 #e8e8e8, 32px 16px 0 #e8e8e8, 48px 16px 0 #e8e8e8, 64px 16px 0 #e8e8e8,
    8px 24px 0 #d6d6d6, 24px 24px 0 #d6d6d6, 40px 24px 0 #d6d6d6;
  image-rendering:pixelated;
  opacity:.9;
  animation:drift linear infinite;
}
.cloud:nth-child(1){top:18px;animation-duration:55s;animation-delay:-5s;scale:.9}
.cloud:nth-child(2){top:58px;animation-duration:70s;animation-delay:-22s;scale:1.1}
.cloud:nth-child(3){top:38px;animation-duration:62s;animation-delay:-38s;scale:.8}
.cloud:nth-child(4){top:78px;animation-duration:80s;animation-delay:-48s;scale:1}
@keyframes drift{from{transform:translateX(-140px)}to{transform:translateX(110vw)}}
a{color:inherit}
.back{
  position:fixed;top:14px;left:14px;text-decoration:none;
  background:#8b8b8b;border:3px solid #373737;border-right-color:#fff;border-bottom-color:#fff;
  padding:8px 12px;font-size:9px;color:#fff;box-shadow:2px 2px 0 #000;
}
.header{max-width:920px;margin:0 auto 22px;text-align:center;text-shadow:3px 3px 0 #3a3a3a, 0 0 10px rgba(0,0,0,.6)}
.header h1{font-size:22px;line-height:1.4;letter-spacing:1px}
.header h1 span{color:#55ff55}
.header p{font-size:8px;margin-top:10px;line-height:2.1;background:rgba(0,0,0,.38);display:inline-block;padding:6px 12px;border-radius:8px;backdrop-filter:blur(4px)}
.mc-panel{
  max-width:920px;margin:0 auto 16px;
  background:#c6c6c6;border:4px solid #000;
  box-shadow:inset -4px -4px 0 #555, inset 4px 4px 0 #fff, 4px 4px 0 rgba(0,0,0,.5);
  padding:12px;
}
.toolbar{display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.count{font-size:12px;color:#373737}
.btn-mc{
  font-family:'Press Start 2P',monospace;font-size:8px;
  background:#8b8b8b;color:#fff;
  border:3px solid #000; border-top-color:#fff; border-left-color:#fff;
  padding:10px 12px;cursor:pointer;
  box-shadow:inset -2px -2px 0 #555, inset 2px 2px 0 #fff;
  text-shadow:1px 1px 0 #373737;
}
.btn-mc:hover{background:#9a9a9a}
.btn-mc:active{border-color:#373737;box-shadow:inset 2px 2px 0 #555;transform:translate(1px,1px)}
.btn-mc.green{background:#5aaa3a;border-color:#2d631d;border-top-color:#8be07a;border-left-color:#8be07a}
.btn-mc.green:hover{background:#6fbf4a}
.folder{font-size:7px;color:#373737;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:#fff;border:2px solid #373737;padding:4px 6px;box-shadow:inset 2px 2px 0 #8b8b8b}
.grid{max-width:920px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{
  background:#c6c6c6;border:3px solid #000;
  box-shadow:inset -3px -3px 0 #555, inset 3px 3px 0 #fff;
  padding:12px;display:flex;flex-direction:column;gap:8px;
  position:relative;
}
.card::before{content:'⬢';position:absolute;top:6px;right:8px;font-size:10px;color:#5aaa3a;text-shadow:1px 1px 0 #000}
.card h3{font-size:9px;color:#373737;word-break:break-all;line-height:1.5;min-height:26px}
.meta{font-size:7px;color:#5a5a5a}
.mc-inv{
  background:#8b8b8b;border:2px solid #373737;box-shadow:inset 2px 2px 0 #fff, inset -2px -2px 0 #555;
  padding:6px;display:flex;align-items:center;gap:8px;
}
.mc-inv .slot{
  width:28px;height:28px;background:#8b8b8b;border:2px solid #373737;
  box-shadow:inset 2px 2px 0 #373737, inset -2px -2px 0 #fff;
  display:grid;place-items:center;font-size:14px;
}
.download-mc{
  font-family:'Press Start 2P',monospace;font-size:8px;
  background:#5aaa3a;color:#fff;text-decoration:none;text-align:center;
  padding:10px;border:3px solid #2d631d;border-top-color:#8be07a;border-left-color:#8be07a;
  box-shadow:inset -2px -2px 0 #2d631d, 2px 2px 0 #000;
  text-shadow:1px 1px 0 #2d631d;
}
.download-mc:hover{background:#6fbf4a}
.download-mc:active{transform:translate(1px,1px)}
.state{
  max-width:920px;margin:24px auto;text-align:center;
  background:#c6c6c6;border:3px solid #000;box-shadow:inset -3px -3px 0 #555, inset 3px 3px 0 #fff, 3px 3px 0 rgba(0,0,0,.4);
  padding:16px;font-size:9px;color:#373737;line-height:1.6
}
.error{color:#9b0000}
.search{font-family:'Press Start 2P',monospace;font-size:7px;padding:8px;border:3px solid #373737;box-shadow:inset 2px 2px 0 #8b8b8b;background:#fff;color:#373737;min-width:180px}
.search::placeholder{color:#8b8b8b}
.card.sel{outline:3px solid #55ff55;outline-offset:-3px}
.cb{width:18px;height:18px;accent-color:#5aaa3a;cursor:pointer}
.sel-bar{max-width:920px;margin:0 auto 10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;background:#c6c6c6;border:3px solid #000;box-shadow:inset -2px -2px 0 #555, inset 2px 2px 0 #fff;padding:8px}
.grass-bar{height:14px;background:repeating-linear-gradient(90deg,#5aaa3a 0 16px,#4a962f 16px 32px);border:3px solid #2d631d;box-shadow:2px 2px 0 #000;margin:0 auto 14px;max-width:920px}
</style>
</head>
<body>
<div class="clouds"><div class="cloud"></div><div class="cloud"></div><div class="cloud"></div><div class="cloud"></div></div>
<a class="back" href="../index.html">‹ INICIO</a>
<div class="header">
<h1>◼ <span>MODS</span> DEL SERVIDOR ◼</h1>
<p>◆ Sincronizado en tiempo real desde Minehost / Pterodactyl ◆<br>Coloca los .jar en /mods y dale a Actualizar</p>
</div>
<div id="mc-widget" class="mc-widget-mc">
  <div class="mcw-head">
    <span class="mc-dot" id="mc-dot"></span>
    <span id="mc-status">Consultando...</span>
    <span id="mc-players" style="margin-left:auto;font-size:7px"></span>
  </div>
  <div class="mcw-ip">
    <span id="mc-ip" style="flex:1;font-size:8px;overflow:hidden;text-overflow:ellipsis">sv21.minehost.pro:25476</span>
    <button class="btn-mc green" id="mc-copy" onclick="copyMcIp()" style="font-size:7px;padding:6px 8px">⎘ COPIAR IP</button>
  </div>
</div>
<style>.mc-widget-mc{max-width:920px;margin:0 auto 14px;background:#c6c6c6;border:4px solid #000;box-shadow:inset -4px -4px 0 #555,inset 4px 4px 0 #fff,4px 4px 0 rgba(0,0,0,.5);padding:10px}
.mcw-head{display:flex;align-items:center;gap:8px;font-size:8px;color:#373737}
.mc-dot{width:12px;height:12px;border:2px solid #000;box-shadow:inset 1px 1px 0 #fff;background:#555}
.mc-dot.online{background:#2ecc71;box-shadow:0 0 6px #2ecc71, inset 1px 1px 0 #fff}
.mc-dot.offline{background:#e74c3c;box-shadow:0 0 6px #e74c3c, inset 1px 1px 0 #fff}
.mcw-ip{margin-top:8px;display:flex;gap:8px;align-items:center;background:#8b8b8b;border:2px solid #373737;box-shadow:inset 2px 2px 0 #fff, inset -2px -2px 0 #555;padding:6px}
</style>
<div class="grass-bar"></div>
<div class="mc-panel">
<div class="toolbar">
<span id="count" class="count"></span>
<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
<input id="search" class="search" placeholder="BUSCAR MOD..." oninput="render()">
<button class="btn-mc" id="pickFolderBtn" onclick="pickFolder()">📁 CARPETA</button>
<span id="folderName" class="folder" style="display:none"></span>
<button class="btn-mc green" onclick="downloadAllSequential()" id="dlAllBtn">⬇ TODOS</button>
<button class="btn-mc green" onclick="downloadZip()">⬇ ZIP</button>
<button class="btn-mc" onclick="loadMods()">↻ ACTUALIZAR</button>
</div>
</div>
</div>
<div class="sel-bar" id="selBar" style="display:none">
<div style="display:flex;gap:8px;align-items:center">
<button class="btn-mc" onclick="selectAll(true)">☑ TODOS</button>
<button class="btn-mc" onclick="selectAll(false)">☐ NINGUNO</button>
<span class="count" id="selCount">0 seleccionados</span>
</div>
<button class="btn-mc green" onclick="downloadSelected()" id="dlSelBtn">⬇ SELECCIÓN (0)</button>
</div>
<div id="progress" class="state" style="display:none"></div>
<div id="state" class="state">Cargando mods...</div>
<div id="grid" class="grid" style="display:none"></div>
<script>
let selected=new Set();
function render(){
  const grid=document.getElementById('grid');
  const count=document.getElementById('count');
  const state=document.getElementById('state');
  const q=(document.getElementById('search').value||'').toLowerCase().trim();
  const filtered=cachedMods.filter(m=>!q||m.name.toLowerCase().includes(q)||m.filename.toLowerCase().includes(q));
  if(!filtered.length){
    grid.style.display='none';
    if(cachedMods.length) { state.style.display='block'; state.textContent='Sin resultados para "'+q+'"'; }
    count.textContent=cachedMods.length+' MODS';
    document.getElementById('selBar').style.display=cachedMods.length?'flex':'none';
    updateSel();
    return;
  }
  state.style.display='none'; grid.style.display='grid';
  grid.innerHTML=filtered.map(m=>{
    const sel=selected.has(m.filename);
    return `<div class="card ${sel?'sel':''}">
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer"><input type="checkbox" class="cb" ${sel?'checked':''} onchange="toggleSel('${m.filename.replace(/'/g,"\\'")}')"><h3 style="flex:1">${m.name}</h3></label>
        <div class="mc-inv"><div class="slot">📦</div><span class="meta">${m.filename}<br>${m.size}</span></div>
        <a class="download-mc" href="#" onclick="downloadOne('${m.filename.replace(/'/g,"\\'")}');return false">DESCARGAR</a>
      </div>`;
  }).join('');
  count.textContent=filtered.length+' / '+cachedMods.length+' MODS';
  document.getElementById('selBar').style.display='flex';
  updateSel();
}
function toggleSel(f){ if(selected.has(f)) selected.delete(f); else selected.add(f); render(); }
function selectAll(v){
  const q=(document.getElementById('search').value||'').toLowerCase().trim();
  const filtered=cachedMods.filter(m=>!q||m.name.toLowerCase().includes(q)||m.filename.toLowerCase().includes(q));
  filtered.forEach(m=> v?selected.add(m.filename):selected.delete(m.filename));
  render();
}
function updateSel(){
  const n=selected.size;
  document.getElementById('selCount').textContent=n+' seleccionados';
  document.getElementById('dlSelBtn').textContent='⬇ SELECCIÓN ('+n+')';
  document.getElementById('dlSelBtn').style.display=n?'':'none';
}
async function downloadSelected(){
  const list=[...selected];
  if(!list.length) return alert('Selecciona al menos 1 mod');
  const useFolder=dirHandle||await ensureFolder();
  const prog=document.getElementById('progress');
  if(useFolder && dirHandle){
    prog.style.display='block';
    for(let i=0;i<list.length;i++){
      prog.textContent='Guardando '+(i+1)+'/'+list.length+': '+list[i];
      try{ const r=await fetch('/.netlify/functions/download-mod?file='+encodeURIComponent(list[i])); const b=await r.blob(); await saveToFolder(list[i], b);}catch(e){}
    }
    prog.textContent='✓ '+list.length+' mods en '+dirHandle.name; setTimeout(()=>prog.style.display='none',3000); return;
  }
  if(!confirm('Descargar '+list.length+' mods?')) return;
  for(const f of list){ fallbackDownload(f); await new Promise(r=>setTimeout(r,600)); }
}
async function loadMods(){
  const state=document.getElementById('state');
  const grid=document.getElementById('grid');
  const count=document.getElementById('count');
  state.style.display='block'; state.textContent='Cargando mods...'; state.className='state';
  grid.style.display='none'; grid.innerHTML='';
  try{
    const res=await fetch('/.netlify/functions/mods');
    if(!res.ok){
      const j=await res.json().catch(()=>({error:res.statusText}));
      throw new Error(j.error||j.details||res.statusText);
    }
    const mods=await res.json();
    cachedMods=Array.isArray(mods)?mods:[];
    selected.clear();
    if(!Array.isArray(mods)||mods.length===0){
      state.textContent='No hay mods instalados';
      count.textContent='';
      document.getElementById('dlAllBtn').style.display='none';
      document.getElementById('selBar').style.display='none';
      return;
    }
    document.getElementById('dlAllBtn').style.display='';
    render();
  }catch(e){
    state.textContent='Error: '+e.message;
    state.className='state error';
    count.textContent='';
  }
}
let cachedMods=[];
let dirHandle=null;
async function pickFolder(){
  if(!window.showDirectoryPicker){ alert('Tu navegador no soporta elegir carpeta (usa Chrome/Edge). Se usara Descargas.'); return; }
  try{
    dirHandle=await window.showDirectoryPicker({mode:'readwrite'});
    const el=document.getElementById('folderName'); el.textContent='📁 '+dirHandle.name; el.style.display='block';
    const perm=await dirHandle.requestPermission({mode:'readwrite'});
    if(perm!=='granted') dirHandle=null;
  }catch(e){ if(e.name!=='AbortError') alert(e.message); }
}
async function ensureFolder(){
  if(dirHandle) return true;
  if(window.showDirectoryPicker){
    const want=confirm('Elige la carpeta donde guardar los mods.\n¿Elegir ahora?');
    if(want){ await pickFolder(); return !!dirHandle; }
  }
  return false;
}
async function saveToFolder(filename, blob){
  if(!dirHandle) return false;
  try{
    const fh=await dirHandle.getFileHandle(filename,{create:true});
    const w=await fh.createWritable(); await w.write(blob); await w.close(); return true;
  }catch(e){ alert('Error guardando '+filename+': '+e.message); return false; }
}
function fallbackDownload(filename){
  const a=document.createElement('a'); a.href='/.netlify/functions/download-mod?file='+encodeURIComponent(filename); a.download=filename;
  document.body.appendChild(a); a.click(); a.remove();
}
async function downloadOne(filename){
  const useFolder=dirHandle||await ensureFolder();
  const prog=document.getElementById('progress');
  if(useFolder && dirHandle){
    prog.style.display='block'; prog.textContent='Descargando '+filename+'...';
    try{
      const res=await fetch('/.netlify/functions/download-mod?file='+encodeURIComponent(filename));
      if(!res.ok) throw new Error('Error '+res.status);
      const blob=await res.blob(); const ok=await saveToFolder(filename, blob);
      prog.textContent=ok?'Guardado en '+dirHandle.name+'/'+filename:'Error';
      setTimeout(()=>prog.style.display='none',2000); if(ok) return;
    }catch(e){ prog.textContent='Error: '+e.message; }
  }
  fallbackDownload(filename);
}
async function downloadAllSequential(){
  if(!cachedMods.length) return alert('No hay mods');
  const useFolder=dirHandle||await ensureFolder();
  if(useFolder && dirHandle){
    const prog=document.getElementById('progress'); prog.style.display='block';
    for(let i=0;i<cachedMods.length;i++){
      const f=cachedMods[i].filename; prog.textContent='Guardando '+(i+1)+'/'+cachedMods.length+': '+f;
      try{ const res=await fetch('/.netlify/functions/download-mod?file='+encodeURIComponent(f)); const blob=await res.blob(); await saveToFolder(f, blob);}catch(e){}
    }
    prog.textContent='✓ '+cachedMods.length+' mods en '+dirHandle.name; setTimeout(()=>prog.style.display='none',3000); return;
  }
  if(!confirm('Se descargaran '+cachedMods.length+' .jar. ¿Continuar?')) return;
  for(let i=0;i<cachedMods.length;i++){ fallbackDownload(cachedMods[i].filename); await new Promise(r=>setTimeout(r,600)); }
}
async function downloadZip(){
  const useFolder=dirHandle||await ensureFolder();
  const url='/.netlify/functions/download-all';
  if(useFolder && dirHandle){
    const prog=document.getElementById('progress'); prog.style.display='block'; prog.textContent='Descargando ZIP...';
    try{
      const res=await fetch(url); if(!res.ok) throw new Error('Error '+res.status);
      const blob=await res.blob(); const ok=await saveToFolder('mods.zip', blob);
      prog.textContent=ok?'ZIP en '+dirHandle.name+'/mods.zip':'Error'; setTimeout(()=>prog.style.display='none',2500); if(ok) return;
    }catch(e){ prog.textContent='Error: '+e.message; }
  }
  window.location.href=url;
}
const MC_IP='sv21.minehost.pro:25476';
const MC_API='https://api.mcsrvstat.us/3/'+MC_IP;
async function refreshMc(){
  const dot=document.getElementById('mc-dot');
  const st=document.getElementById('mc-status');
  const pl=document.getElementById('mc-players');
  if(!dot) return;
  try{
    const r=await fetch(MC_API); const j=await r.json();
    if(j.online){ dot.className='mc-dot online'; st.textContent='🟢 En línea'; const o=j.players?.online??0, m=j.players?.max??'?'; pl.textContent=o+' / '+m+' jugadores'; }
    else { dot.className='mc-dot offline'; st.textContent='🔴 Servidor desconectado'; pl.textContent=''; }
  }catch(e){ dot.className='mc-dot offline'; st.textContent='🔴 Servidor desconectado'; pl.textContent=''; }
}
function copyMcIp(){
  navigator.clipboard.writeText(MC_IP).then(()=>{
    const b=document.getElementById('mc-copy'); const prev=b.textContent;
    b.textContent='¡COPIADO! ✓'; setTimeout(()=>b.textContent=prev,2000);
  });
}
refreshMc(); setInterval(refreshMc,60000);
loadMods();
</script>
</body>
</html>
