    .info-mobile { display: none; }

    #back-icon { width: 14px; height: 14px; image-rendering: pixelated; }

    #mute-btn { background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3); width: 32px; height: 32px; border-radius: 50%; cursor: pointer; position: relative; overflow: hidden; }
    #mute-icon { width: 20px; height: 20px; image-rendering: pixelated; }
    #vol-slider { width: 70px; height: 6px; -webkit-appearance: none; appearance: none; background: rgba(255,255,255,0.2); outline: none; cursor: pointer; border: none; }

    #vol-slider::-moz-range-thumb { width: 10px; height: 10px; background: #4ecdc4; cursor: pointer; border: none; }
    #vol-slider::-webkit-slider-runnable-track { height: 6px; background: rgba(255,255,255,0.2); }
    #vol-slider::-moz-range-track { height: 6px; background: rgba(255,255,255,0.2); border: none; }

    #touch-controls {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 45vh;
      pointer-events: none;
      z-index: 50;
    }
    .touch-btn {
      position: absolute;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: monospace;
      font-weight: bold;
      color: #fff;
      pointer-events: auto;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }
    .touch-btn:active, .touch-btn.active {
      filter: brightness(1.4);
      transform: scale(0.92);
    }
    #joystick {
      position: absolute;
      left: 15px;
      bottom: 15px;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: rgba(78, 205, 196, 0.15);
      border: 2px solid rgba(78, 205, 196, 0.5);
      pointer-events: auto;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }
    #joystick-knob {
      position: absolute;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(78, 205, 196, 0.55);
      border: 2px solid rgba(78, 205, 196, 0.8);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      transition: none;
    }
    .btn-jump {
      right: 10px;
      bottom: 90px;
      width: 80px;
      height: 80px;
      background: rgba(0, 184, 148, 0.45);
      border: 2px solid rgba(0, 184, 148, 0.7);
    }
    .btn-jump::after { content: '▲'; font-size: 28px; }
    .btn-dash {
      right: 100px;
      bottom: 130px;
      width: 60px;
      height: 60px;
      background: rgba(233, 69, 96, 0.45);
      border: 2px solid rgba(233, 69, 96, 0.7);
      font-size: 14px !important;
    }
    .btn-dash::after { content: 'Z'; font-size: 18px; }
    .btn-wave {
      right: 10px;
      bottom: 190px;
      width: 60px;
      height: 60px;
      background: rgba(255, 159, 67, 0.45);
      border: 2px solid rgba(255, 159, 67, 0.7);
    }
    .btn-wave::after { content: 'X'; font-size: 18px; }
    .btn-restart {
      right: 100px;
      bottom: 30px;
      width: 50px;
      height: 50px;
      background: rgba(255, 255, 255, 0.2);
      border: 2px solid rgba(255, 255, 255, 0.4);
    }
    .btn-restart::after { content: 'R'; font-size: 16px; }
    .btn-equip {
      right: 160px;
      bottom: 30px;
      width: 50px;
      height: 50px;
      background: rgba(243, 156, 18, 0.3);
      border: 2px solid rgba(243, 156, 18, 0.5);
      display: none;
    }
    .btn-equip::after { content: 'E'; font-size: 16px; }

      .info-mobile { display: block; }

      #mute-btn { width: 28px; height: 28px; }
      #mute-icon { width: 16px; height: 16px; }
      #vol-slider { width: 50px; }
    }

var impactAudio = null;
function initImpactAudio() {
  if (!impactAudio) {
    impactAudio = new Audio('../../assets/audio/sun_impact.mp3');
    impactAudio.volume = 0.9;
  }
}
function playImpactSound() {
  if (bgm.muted) return;
  initImpactAudio();
  impactAudio.currentTime = 0;
  impactAudio.play().catch(function(e) { console.log('Impact sound failed:', e); });
}
var dashAudioCtx = null;
function playDashSound() {
  if (bgm.muted) return;
  try {
    if (!dashAudioCtx) dashAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (dashAudioCtx.state === 'suspended') dashAudioCtx.resume();
    var o = dashAudioCtx.createOscillator();
    var g = dashAudioCtx.createGain();
    var f = dashAudioCtx.createBiquadFilter();
    f.type = 'highpass'; f.frequency.value = 400;
    o.type = 'sine';
    o.connect(f); f.connect(g); g.connect(dashAudioCtx.destination);
    o.frequency.setValueAtTime(500, dashAudioCtx.currentTime);
    o.frequency.linearRampToValueAtTime(1100, dashAudioCtx.currentTime + 0.08);
    o.frequency.linearRampToValueAtTime(700, dashAudioCtx.currentTime + 0.14);
    g.gain.setValueAtTime(0.28, dashAudioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01, dashAudioCtx.currentTime + 0.14);
    o.start(dashAudioCtx.currentTime);
    o.stop(dashAudioCtx.currentTime + 0.15);
    var o2 = dashAudioCtx.createOscillator();
    var g2 = dashAudioCtx.createGain();
    o2.type = 'triangle';
    o2.connect(g2); g2.connect(dashAudioCtx.destination);
    o2.frequency.setValueAtTime(900, dashAudioCtx.currentTime);
    o2.frequency.exponentialRampToValueAtTime(200, dashAudioCtx.currentTime + 0.12);
    g2.gain.setValueAtTime(0.12, dashAudioCtx.currentTime);
    g2.gain.exponentialRampToValueAtTime(0.01, dashAudioCtx.currentTime + 0.12);
    o2.start(dashAudioCtx.currentTime);
    o2.stop(dashAudioCtx.currentTime + 0.12);
  } catch(e) {}
}

function drawSpeakerIcon(muted) {
  ictx.clearRect(0, 0, 10, 10);

  if (!muted) {
    ictx.fillStyle = c;
    ictx.fillRect(1, 3, 2, 4);
    ictx.fillRect(3, 2, 1, 1);
    ictx.fillRect(3, 7, 1, 1);
    ictx.fillRect(4, 1, 1, 2);
    ictx.fillRect(4, 7, 1, 2);
    ictx.fillRect(5, 0, 1, 2);
    ictx.fillRect(5, 8, 1, 2);
    ictx.fillRect(6, 3, 1, 1);
    ictx.fillRect(7, 2, 1, 1);
    ictx.fillRect(8, 1, 1, 1);
    ictx.fillRect(6, 6, 1, 1);
    ictx.fillRect(7, 7, 1, 1);
    ictx.fillRect(8, 8, 1, 1);
  } else {
    ictx.fillStyle = c;
    ictx.fillRect(1, 3, 2, 4);
    ictx.fillRect(3, 2, 1, 1);
    ictx.fillRect(3, 7, 1, 1);
    ictx.fillRect(4, 1, 1, 2);
    ictx.fillRect(4, 7, 1, 2);
    ictx.fillStyle = '#e94560';
    ictx.fillRect(5, 2, 1, 1);
    ictx.fillRect(6, 3, 1, 1);
    ictx.fillRect(7, 4, 1, 1);
    ictx.fillRect(6, 5, 1, 1);
    ictx.fillRect(5, 6, 1, 1);
    ictx.fillRect(7, 2, 1, 1);
    ictx.fillRect(6, 3, 1, 1);
    ictx.fillRect(5, 4, 1, 1);
    ictx.fillRect(6, 5, 1, 1);
    ictx.fillRect(7, 6, 1, 1);
  }
}
drawSpeakerIcon(false);

volSlider.addEventListener('input', function() {
  baseVol = this.value / 100;
  bgm.volume = baseVol;
  bgmSky.volume = baseVol;
  bgmSecret.volume = baseVol;
  bgmGalaxy.volume = baseVol;
  bgm.muted = false;
  bgmSky.muted = false;
  bgmSecret.muted = false;
  bgmGalaxy.muted = false;
  drawSpeakerIcon(false);
});
muteBtn.addEventListener('click', function() {

  bgmSecret.muted = bgm.muted;
  bgmGalaxy.muted = bgm.muted;
  drawSpeakerIcon(bgm.muted);
});

var MERC_NIN = 7, MERC_NHID = 8, MERC_NOUT = 3;
function mercForward(inp) {
  var h = [], o = [], idx = 0;
  for (var i = 0; i < MERC_NHID; i++) {
    var s = MERC_WEIGHTS[idx + MERC_NIN];
    for (var j = 0; j < MERC_NIN; j++) s += MERC_WEIGHTS[idx + j] * inp[j];
    idx += MERC_NIN + 1;
    h.push(Math.tanh(s));
  }
  for (var k = 0; k < MERC_NOUT; k++) {
    var t = MERC_WEIGHTS[idx + MERC_NHID];
    for (var l = 0; l < MERC_NHID; l++) t += MERC_WEIGHTS[idx + l] * h[l];
    idx += MERC_NHID + 1;
    o.push(Math.tanh(t));
  }
  return o;
}

function loadLevel(n) {
  var L = levels[n % levels.length];
  currentLevel = n;
  if (L.secret) {
    bgm.pause();
    bgmSky.pause();
    bgmGalaxy.pause();
    bgmSecret.currentTime = 0;
    if (!bgmSecret.muted) bgmSecret.play();
  } else if (L.galaxy) {
    bgm.pause();
    bgmSky.pause();
    bgmSecret.pause();
    bgmGalaxy.currentTime = 0;
    if (!bgmGalaxy.muted) bgmGalaxy.play();
  } else if (L.skyFade) {
    bgm.pause();
    bgmSecret.pause();
    bgmGalaxy.pause();
    bgmSky.currentTime = 0;
    if (!bgmSky.muted) bgmSky.play();
  } else {
    bgmSky.pause();
    bgmSecret.pause();
    bgmGalaxy.pause();
    if (bgm.paused && !dead) { bgm.currentTime = 0; if (!bgm.muted) bgm.play(); }
  }
  px = L.spawn[0];
  py = L.spawn[1];
  pvx = 0;
  pvy = 0;
  onGround = false;
  facing = 1;

  platList = [];
  var i;
  for (i = 0; i < L.ground.length; i++) platList.push(L.ground[i].slice());
  for (i = 0; i < L.plat.length; i++) platList.push(L.plat[i].slice());

  gemList = [];

    gemList.push({ x: L.gems[i][0], y: L.gems[i][1], alive: true });

  enemyList = [];

function die() {
  if (sunBoss) {
    sunDeath = true;
    sunDialogue = "";
    sunDialogueTimer = 0;
    return;
  }
  if (currentLevel >= 2 && checkpoint && checkpoint.active) {
    px = checkpoint.x;
    py = checkpoint.y;
    pvy = 0;
    pvx = 0;
    for (var di = 0; di < enemyList.length; di++) {
      var de = enemyList[di];
      if (Math.abs(de.x - px) < 60) { de.x = de.ox; de.vx = Math.abs(de.vx); }
    }
  } else if (currentLevel >= 2) {
    var L = levels[currentLevel];
    px = L.spawn[0];
    py = L.spawn[1];
    pvy = 0;
    pvx = 0;
    for (var di2 = 0; di2 < enemyList.length; di2++) {
      var de2 = enemyList[di2];
      if (Math.abs(de2.x - px) < 60) { de2.x = de2.ox; de2.vx = Math.abs(de2.vx); }
    }
  } else {
    dead = true;
    bgm.pause();
    bgmSky.pause();
  }
}

function hitTest(ax, ay, aw, ah, bx, by, bw, bh) {
  return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
}

function hitSunBoss() {
  playImpactSound();
  frameShake = 14;
  sunBoss.hp--;
  sunBoss.hitCount++;
  sunBoss.stun = 20;
  sunHitCount++;
  shakeX = (Math.random() - 0.5) * 6;
  shakeY = (Math.random() - 0.5) * 6;
  pvx = -12;
  pvy = -9;
  sunKnockback = 15;
  dashTimer = 0;
  dashMX = 0;
  dashMY = 0;

  if (sunBoss.phase >= 2) {
    playerHp -= 1;
    showPlayerHealth = true;
  }

  if (sunBoss.hp <= 0) {
    sunBoss.hp = 0;
    sunDialogue = "";
    sunDialogueTimer = 0;
    sunDeath = true;
    score += 100;
  } else if (sunBoss.hp <= 25 && sunBoss.phase < 3) {
    sunBoss.phase = 3;
    playerHp = 1;
    showPlayerHealth = true;
    sunDialogue = "";
    sunDialogueTimer = 0;
  } else if (sunBoss.hp <= 50 && sunBoss.phase < 2) {
    sunBoss.phase = 2;
    showPlayerHealth = true;
    sunDialogue = "";
    sunDialogueTimer = 0;
  } else {
    sunDialogue = "";
    sunDialogueTimer = 0;
  }
}

function update() {
  if (sunBoss || sunDeath) {
    if (sunDialogueTimer > 0) sunDialogueTimer--;
    else sunDialogue = '';

    var L = levels[currentLevel];
    var hpRatio = sunBoss ? sunBoss.hp / sunBoss.maxHp : 0;
    var speed = 0.008 + (1 - hpRatio) * 0.025;
    sunRays += speed;
    var maxP = sunDeath ? 12 : 20 + Math.floor((1 - hpRatio) * 45);

    var pMinX, pMaxX, pMinY, pMaxY, rise;
    if (sunDeath) {
      pMinX = 200; pMaxX = 280; pMinY = 55; pMaxY = 135; rise = false;
    } else if (sunBoss) {
      pMinX = 315; pMaxX = 478; pMinY = 20; pMaxY = 375; rise = true;
    } else {
      var pr = L.sunR1 || 40;
      pMinX = 240 - pr; pMaxX = 240 + pr;
      pMinY = 160 - pr; pMaxY = 160 + pr; rise = true;
    }

    function place(p) {
      p.x = pMinX + Math.random() * (pMaxX - pMinX);
      p.y = pMinY + Math.random() * (pMaxY - pMinY);
      p.vx = (Math.random() - 0.5) * 0.5;
      p.vy = rise ? -(0.12 + Math.random() * 0.4) : (0.2 + Math.random() * 0.5);
    }

    while (sunParticles.length < maxP) {
      var type = Math.random();
      var p = {
        vx: 0, vy: 0, age: 0,
        maxLife: 160 + Math.random() * 260,
        size: type < 0.35 ? 0.9 + Math.random() * 1.3 : type < 0.7 ? 1.8 + Math.random() * 2.2 : 3.2 + Math.random() * 3.5,
        type: type < 0.35 ? 0 : type < 0.7 ? 1 : 2,
        wobblePhase: Math.random() * Math.PI * 2,
        wobbleSpeed: 0.03 + Math.random() * 0.05,
        wobbleAmp: 0.5 + Math.random() * 1.2
      };
      place(p);
      sunParticles.push(p);
    }
    for (var si = sunParticles.length - 1; si >= 0; si--) {
      var sp = sunParticles[si];
      sp.age++;
      sp.wobblePhase += sp.wobbleSpeed;
      sp.x += sp.vx + Math.sin(sp.wobblePhase) * sp.wobbleAmp;
      sp.y += sp.vy;
      var lifeRatio = sp.age / sp.maxLife;
      var fade = 1;
      if (lifeRatio < 0.12) fade = lifeRatio / 0.12;
      else if (lifeRatio > 0.72) fade = 1 - (lifeRatio - 0.72) / 0.28;
      sp.fade = Math.max(0, Math.min(1, fade));
      if (sp.x < pMinX - 10 || sp.x > pMaxX + 10 || sp.y < pMinY - 30 || sp.y > 360 || sp.age >= sp.maxLife) {
        if (sunDeath) { sunParticles.splice(si, 1); }
        else {
          place(sp);
          sp.age = 0;
          sp.maxLife = 160 + Math.random() * 260;
        }
      }
    }
  }

  if (dead || won || sunDeath) return;

  if (sunDialogueTimer > 0) sunDialogueTimer--;
  else sunDialogue = '';

  if (sunKnockback > 0) sunKnockback--;

  var wasDashing = dashTimer > 0 || Math.abs(dashMX) > 0.5 || Math.abs(dashMY) > 0.5;
  var mx = 0;
  if (keys.ArrowLeft) mx = -1;
  if (keys.ArrowRight) mx = 1;

  if (dashCD > 0) dashCD--;

  if (dashTimer > 0) {
    if (!dashHeld && dashTimer > 1) {
      dashTimer = 0;
      dashMX = 0;
      dashMY = 0;
      pvx = 0;
      pvy = 0;
    } else {
      dashTimer--;
      pvx = dashDX * 10;
      pvy = dashDY * 10;
      dashMX = dashDX * 10;
      dashMY = dashDY * 10;
      dashTrail.push({ x: px, y: py, life: 14 });
      dashTrail.push({ x: px - dashDX * 6, y: py - dashDY * 6, life: 10 });
      coyoteTimer = 0;
      jumpBufferTimer = 0;
    }
  } else {
    if (sunKnockback > 0) {
      pvx *= 0.9;
      pvy += GRAV_DOWN;
      if (pvy > MAX_FALL) pvy = MAX_FALL;
    } else if (dashMX !== 0) {
      pvx = dashMX;
      dashMX *= 0.88;
      if (Math.abs(dashMX) < 0.5) dashMX = 0;
    }
    if (sunKnockback <= 0 && dashMY !== 0) {
      pvy = dashMY;
      dashMY *= 0.88;
      if (Math.abs(dashMY) < 0.5) dashMY = 0;
    }

    if (sunKnockback <= 0) {
      var accel = onGround ? ACCEL : AIR_ACCEL;
      var decel = onGround ? DECEL : AIR_DECEL;
      if (mx !== 0) {
        pvx += mx * accel;
        if (pvx > SPD) pvx = SPD;
        if (pvx < -SPD) pvx = -SPD;
        facing = mx;
      } else {
        if (pvx > 0) { pvx -= decel; if (pvx < 0) pvx = 0; }
        else if (pvx < 0) { pvx += decel; if (pvx > 0) pvx = 0; }
      }
    }
  }

  if (zPressed && hasDash && dashCD <= 0 && dashTimer <= 0) {
    dashTimer = 9;
    dashCD = 42;
    zPressed = false;
    var dx = 0, dy = 0;
    if (keys.ArrowLeft) dx = -1;
    if (keys.ArrowRight) dx = 1;
    if (keys.ArrowUp) dy = -1;
    if (keys.ArrowDown) dy = 1;
    if (dx !== 0 || dy !== 0) {
      var len = Math.sqrt(dx * dx + dy * dy);
      dashDX = dx / len;
      dashDY = dy / len;
    } else {
      dashDX = facing;
      dashDY = 0;
    }
    dashTrail.push({ x: px, y: py, life: 14 });
    try{ playDashSound(); }catch(e){}
  }

      }
    }

    if (boss.hp <= 0) {
      boss = null;
      score += 100;
    } else {
      boss.phase = boss.hp <= boss.maxHp * 0.3 ? 2 : boss.hp <= boss.maxHp * 0.6 ? 1 : 0;
    }
  }

  if (sunBoss) {
    if (sunBoss.stun > 0) sunBoss.stun--;

    if (sunBoss.stun <= 0 && hitTest(px, py, 12, 16, 300, 0, 180, 800)) {
      if (dashKillEquipped && wasDashing) {
        hitSunBoss();
      } else {
        pvx = -12;
        pvy = -9;
        sunKnockback = 15;
      }
    }
  }

  if (currentLevel === 6 && px > 195 && px < 285 && py < 0 && pvy < 0) {
    loadLevel(12);
    return;
  }

  if (currentLevel >= 12 && currentLevel <= 15 && levels[currentLevel].secret && py < 0 && !sunDeath) {
    loadLevel(currentLevel + 1);
    return;
  }

  if (flagObj && Math.abs(px - flagObj.x) < 16 && Math.abs(py - flagObj.y) < 20) {
    if (!boss && !sunBoss) {
      if (levels[currentLevel] && levels[currentLevel].secret) {
        score += 100;
        if (levels[currentLevel].sunBossLevel && sunBoss && sunBoss.hp > 0) {
          return;
        }
        won = true;
      } else if (levels[currentLevel] && levels[currentLevel].shop) {
        score += 100;
        won = true;
      } else {
        score += 50;
        if (currentLevel + 1 >= levels.length) {
          won = true;
        } else {
          loadLevel(currentLevel + 1);
        }
      }
    }
  }

  for (i = dashTrail.length - 1; i >= 0; i--) {
    dashTrail[i].life--;
    if (dashTrail[i].life <= 0) dashTrail.splice(i, 1);
  }
}

function skyFadeT() {
  var Lf = levels[currentLevel];
  if (!Lf || !Lf.skyFade || !flagObj) return 0;
  var d = Math.abs(px - flagObj.x);
  var r = (Lf.fadeRange || 1400) * 1.5;
  var t = 1 - Math.min(1, d / r);
  if (t < 0) return 0;
  if (t > 1) return 1;
  return t * t * (3 - 2 * t);
}

function drawGalaxySky(alpha) {
  var a = alpha === undefined ? 1 : alpha;
  var grdG = ctx.createLinearGradient(0, 0, 0, 320);
  grdG.addColorStop(0, 'rgba(5,0,20,' + a + ')');
  grdG.addColorStop(0.5, 'rgba(11,5,51,' + a + ')');
  grdG.addColorStop(1, 'rgba(26,10,58,' + a + ')');
  ctx.fillStyle = grdG;
  ctx.fillRect(0, 0, 480, 320);

  var tNow = Date.now() / 600;
  for (var gi = 0; gi < 70; gi++) {
    var sx = ((gi * 137 + 20) % 500) - 10;
    var sy = ((gi * 89 + 15) % 300);
    var tw = 0.4 + 0.6 * Math.abs(Math.sin(tNow + gi));
    ctx.fillStyle = gi % 9 === 0 ? '#a29bfe' : (gi % 5 === 0 ? '#74b9ff' : '#ffffff');
    ctx.globalAlpha = tw * a;
    ctx.fillRect(sx, sy, gi % 4 === 0 ? 2 : 1, gi % 4 === 0 ? 2 : 1);
  }
  ctx.globalAlpha = 1;

  var gcx = 340, gcy = 90;
  var gglow = ctx.createRadialGradient(gcx, gcy, 0, gcx, gcy, 90);
  gglow.addColorStop(0, 'rgba(155,89,182,' + (0.5 * a) + ')');
  gglow.addColorStop(0.4, 'rgba(108,92,231,' + (0.25 * a) + ')');
  gglow.addColorStop(1, 'rgba(108,92,231,0)');
  ctx.fillStyle = gglow;
  ctx.beginPath();
  ctx.arc(gcx, gcy, 90, 0, Math.PI * 2);
  ctx.fill();

  for (var ga2 = 0; ga2 < 110; ga2++) {
    var ang = ga2 * 0.42;
    var rad = (ga2 % 45) * 1.9;
    var gpx = gcx + Math.cos(ang + tNow * 0.3) * rad * 0.45;
    var gpy = gcy + Math.sin(ang) * rad * 0.28;
    ctx.fillStyle = ga2 % 4 === 0 ? 'rgba(255,214,165,' + (0.7 * a) + ')' : (ga2 % 3 === 0 ? 'rgba(155,180,255,' + (0.7 * a) + ')' : 'rgba(230,170,255,' + (0.6 * a) + ')');
    ctx.fillRect(gpx, gpy + 20, ga2 % 3 === 0 ? 2 : 1, ga2 % 3 === 0 ? 2 : 1);
  }
}

function render() {
  var isSecret = levels[currentLevel] && levels[currentLevel].secret;
  var L = levels[currentLevel];

  if (isSecret) {
    var grdS = ctx.createLinearGradient(0, 0, 0, 280);
    grdS.addColorStop(0, '#1a0533');
    grdS.addColorStop(0.3, '#6b1d5e');
    grdS.addColorStop(0.5, '#e94560');
    grdS.addColorStop(0.65, '#f39c12');
    grdS.addColorStop(0.75, '#f1c40f');
    grdS.addColorStop(1, '#1a1a2e');
    ctx.fillStyle = grdS;
    ctx.fillRect(0, 0, 480, 320);

    var sunR1 = L.sunR1 || 40;
    var sunR2 = L.sunR2 || 30;
    var sunCX = sunBoss ? 520 : 240;
    var sunCY = sunBoss ? 200 : 160;

    if (sunBoss) {
      var hpRatio = sunBoss.hp / sunBoss.maxHp;
      var rayCount = 10;
      var rayLen = 80 + (1 - hpRatio) * 140;
      var rayAlpha = 0.12 + (1 - hpRatio) * 0.2;
      for (var ri = 0; ri < rayCount; ri++) {
        var angle = sunRays + (ri / rayCount) * Math.PI * 2;
        var rx1 = sunCX + Math.cos(angle) * (sunR1 + 5);
        var ry1 = sunCY + Math.sin(angle) * (sunR1 + 5);
        var rx2 = sunCX + Math.cos(angle) * (sunR1 + rayLen);
        var ry2 = sunCY + Math.sin(angle) * (sunR1 + rayLen);
        ctx.strokeStyle = 'rgba(243,156,18,' + rayAlpha + ')';
        ctx.lineWidth = 2 + (1 - hpRatio) * 3;
        ctx.beginPath();
        ctx.moveTo(rx1, ry1);
        ctx.lineTo(rx2, ry2);
        ctx.stroke();
      }

      var glowPulse = Math.sin(Date.now() / (300 - hpRatio * 150)) * (8 + (1 - hpRatio) * 12);
      var glowAlpha = 0.15 + (1 - hpRatio) * 0.2;
      ctx.fillStyle = 'rgba(243,156,18,' + glowAlpha + ')';
      ctx.beginPath();
      ctx.arc(sunCX, sunCY, sunR1 + 20 + glowPulse, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.fillStyle = sunBoss && sunBoss.stun > 0 ? '#888' : '#f39c12';
    ctx.beginPath();
    ctx.arc(sunCX, sunCY, sunR1, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = sunBoss && sunBoss.stun > 0 ? '#aaa' : '#f1c40f';
    ctx.beginPath();
    ctx.arc(sunCX, sunCY, sunR2, 0, Math.PI * 2);
    ctx.fill();

    if (sunBoss) {
      ctx.fillStyle = 'rgba(0,0,0,0.1)';
      for (i = 0; i < 10; i++) {
        var w1 = 20 + i * 18;
        ctx.fillRect(sunCX - w1, sunCY + sunR1 * 0.6 + i * 10, w1 * 2, 8);
      }
    }

    if (sunParticles.length > 0) {
      for (var spi = 0; spi < sunParticles.length; spi++) {
        var spp = sunParticles[spi];
        var sa = spp.fade !== undefined ? spp.fade * 0.9 : 0.9;
        if (spp.type === 0) {
          ctx.fillStyle = 'rgba(255,255,235,' + sa + ')';
          ctx.beginPath();
          ctx.arc(spp.x, spp.y, spp.size, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = 'rgba(255,236,180,' + (sa * 0.45) + ')';
          ctx.beginPath();
          ctx.arc(spp.x, spp.y, spp.size * 2.4, 0, Math.PI * 2);
          ctx.fill();
        } else if (spp.type === 1) {
          var grd = ctx.createRadialGradient(spp.x, spp.y, 0, spp.x, spp.y, spp.size * 2.2);
          grd.addColorStop(0, 'rgba(255,224,120,' + sa + ')');
          grd.addColorStop(0.35, 'rgba(245,170,40,' + (sa * 0.6) + ')');
          grd.addColorStop(1, 'rgba(220,120,20,0)');
          ctx.fillStyle = grd;
          ctx.beginPath();
          ctx.arc(spp.x, spp.y, spp.size * 2.2, 0, Math.PI * 2);
          ctx.fill();
        } else {
          var grd2 = ctx.createRadialGradient(spp.x, spp.y, 0, spp.x, spp.y, spp.size * 3);
          grd2.addColorStop(0, 'rgba(255,244,200,' + sa + ')');
          grd2.addColorStop(0.18, 'rgba(255,190,70,' + (sa * 0.7) + ')');
          grd2.addColorStop(0.5, 'rgba(235,135,25,' + (sa * 0.3) + ')');
          grd2.addColorStop(1, 'rgba(205,90,15,0)');
          ctx.fillStyle = grd2;
          ctx.beginPath();
          ctx.arc(spp.x, spp.y, spp.size * 3, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    if (sunBoss) {
      var bw = 80;
      var bfill = (sunBoss.hp / sunBoss.maxHp) * bw;
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(240 - bw / 2, 10, bw, 8);
      ctx.fillStyle = sunBoss.hp <= 25 ? '#e74c3c' : '#f39c12';
      ctx.fillRect(240 - bw / 2, 10, bfill, 8);
      ctx.fillStyle = '#fff';
      ctx.font = '8px monospace';
      ctx.textAlign = 'center';
      ctx.fillText('SOL ' + sunBoss.hp + '%', 240, 8);
      ctx.textAlign = 'left';
    }
  } else if (L.galaxy) {
    drawGalaxySky(1);
  } else if (L.skyFade) {
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(0, 0, 480, 320);
    var fadeT = skyFadeT();
    if (fadeT > 0.01) {
      drawGalaxySky(fadeT);
    }
  } else {
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(0, 0, 480, 320);
  }

  var i, p, g, e, t;
  var cx = -camX + shakeX, cy = -camY + shakeY;
  shakeX *= 0.8;
  shakeY *= 0.8;
  if (Math.abs(shakeX) < 0.5) shakeX = 0;
  if (Math.abs(shakeY) < 0.5) shakeY = 0;

  if (!isSecret && !L.galaxy) {
    var starA = 1;
    if (L.skyFade) starA = 1 - skyFadeT();
    if (starA > 0) {
      ctx.fillStyle = '#fff';
      ctx.globalAlpha = starA;
      for (i = 0; i < 40; i++) {
        ctx.fillRect((i * 67 + 10) % 480, (i * 43 + 5 + cy * 0.2) % (levelH > 320 ? levelH : 160), 1, 1);
      }
      ctx.globalAlpha = 1;
    }
  }

  ctx.fillStyle = isSecret ? '#2d1b4e' : (L.galaxy ? '#4a2b7a' : '#6c5ce7');
  for (i = 0; i < platList.length; i++) {
    p = platList[i];
    ctx.fillRect(p[0] + cx, p[1] + cy, p[2], p[3]);
  }
  ctx.fillStyle = isSecret ? '#4a2d6e' : (L.galaxy ? '#00cec9' : '#00b894');
  for (i = 0; i < platList.length; i++) {
    p = platList[i];
    ctx.fillRect(p[0] + cx, p[1] + cy, p[2], 3);
  }

  for (i = 0; i < spikeList.length; i++) {
    var sp = spikeList[i];
    var sw = sp.w;
    var sh = 12;
    ctx.fillStyle = '#e94560';
    ctx.beginPath();
    ctx.moveTo(sp.x + cx, sp.y + cy);
    ctx.lineTo(sp.x + sw / 2 + cx, sp.y - sh + cy);
    ctx.lineTo(sp.x + sw + cx, sp.y + cy);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#ff6b6b';
    ctx.beginPath();
    ctx.moveTo(sp.x + 2 + cx, sp.y + cy);
    ctx.lineTo(sp.x + sw / 2 + cx, sp.y - sh + 4 + cy);
    ctx.lineTo(sp.x + sw - 2 + cx, sp.y + cy);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.fillRect(sp.x + sw / 2 - 1 + cx, sp.y - sh + cy, 2, 3);
  }

  for (i = 0; i < dashPointList.length; i++) {
    var dp = dashPointList[i];
    if (!dp.alive) continue;
    var dpw = Math.sin(Date.now() / 180 + i) * 2;
    ctx.fillStyle = '#ff69b4';
    ctx.fillRect(dp.x - 6 + dpw + cx, dp.y - 6 + cy, 12, 12);
    ctx.fillStyle = '#ffb6d9';
    ctx.fillRect(dp.x - 3 + dpw + cx, dp.y - 3 + cy, 6, 6);
    ctx.fillStyle = '#fff';
    ctx.fillRect(dp.x - 1 + dpw + cx, dp.y - 1 + cy, 2, 2);
  }

  for (i = 0; i < gemList.length; i++) {
    g = gemList[i];
    if (!g.alive) continue;
    var w = Math.sin(Date.now() / 200 + i) * 1.5;
    ctx.fillStyle = '#ffd700';
    ctx.fillRect(g.x - 4 + w + cx, g.y - 4 + cy, 8, 8);
    ctx.fillStyle = '#fff8a0';
    ctx.fillRect(g.x - 2 + w + cx, g.y - 2 + cy, 4, 4);
  }

  if (dashItem.alive) {
    var dw = Math.sin(Date.now() / 150) * 2;
    ctx.fillStyle = '#e94560';
    ctx.fillRect(dashItem.x - 6 + dw + cx, dashItem.y - 6 + cy, 12, 12);
    ctx.fillStyle = '#ff6b6b';
    ctx.fillRect(dashItem.x - 3 + dw + cx, dashItem.y - 3 + cy, 6, 6);
    ctx.fillStyle = '#fff';
    ctx.font = '8px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('Z', dashItem.x + dw + cx, dashItem.y + 3 + cy);
    ctx.textAlign = 'left';
  }

  if (waveItem && waveItem.alive) {
    var ww = Math.sin(Date.now() / 120) * 2;
    ctx.fillStyle = '#ff9f43';
    ctx.fillRect(waveItem.x - 6 + ww + cx, waveItem.y - 6 + cy, 12, 12);
    ctx.fillStyle = '#feca57';
    ctx.fillRect(waveItem.x - 3 + ww + cx, waveItem.y - 3 + cy, 6, 6);
    ctx.fillStyle = '#fff';
    ctx.font = '8px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('X', waveItem.x + ww + cx, waveItem.y + 3 + cy);
    ctx.textAlign = 'left';
  }

  if (waveActive) {
    waveRadius += 6;
    var wa = 1 - waveRadius / 120;
    ctx.strokeStyle = 'rgba(255,159,67,' + wa + ')';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(waveX + cx, waveY + cy, waveRadius, 0, Math.PI * 2);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(254,202,87,' + (wa * 0.5) + ')';
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.arc(waveX + cx, waveY + cy, waveRadius * 0.7, 0, Math.PI * 2);
    ctx.stroke();
    if (waveRadius >= 120) waveActive = false;
  }

  for (i = 0; i < enemyList.length; i++) {
    e = enemyList[i];
    ctx.fillStyle = '#e94560';
    ctx.fillRect(e.x + cx, e.y + cy, 14, 14);
    ctx.fillStyle = '#fff';
    ctx.fillRect(e.x + 2 + cx, e.y + 2 + cy, 3, 3);
    ctx.fillRect(e.x + 9 + cx, e.y + 2 + cy, 3, 3);
    ctx.fillStyle = '#000';
    ctx.fillRect(e.x + 3 + cx, e.y + 3 + cy, 2, 2);
    ctx.fillRect(e.x + 10 + cx, e.y + 3 + cy, 2, 2);
  }

  if (mercenary && mercenary.alive) {
    var mx = mercenary.x + cx, my = mercenary.y + cy;
    if (mercenary.trail && mercenary.trail.length > 0) {
      for (var ti = 0; ti < mercenary.trail.length; ti++) {
        var tr = mercenary.trail[ti];
        var a = (tr.life / 14) * (mercenary.state==='dash'?0.85:0.45);
        ctx.fillStyle = 'rgba(116,185,255,' + a + ')';
        ctx.fillRect(tr.x + cx, tr.y + cy, 12, 14);
        ctx.fillStyle = 'rgba(255,255,255,' + a*0.5 + ')';
        ctx.fillRect(tr.x + 2 + cx, tr.y + 2 + cy, 8, 10);
      }
    }
    if (mercenary.state === 'dash') {
      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      ctx.fillRect(mx - 2, my - 1, 16, 16);
    }
    if (mercenary.hired) {
      ctx.fillStyle = '#0984e3';
      ctx.fillRect(mx, my, 12, 14);
      ctx.fillStyle = '#74b9ff';
      ctx.fillRect(mx + 1, my + 1, 10, 12);
      ctx.fillStyle = '#dfe6e9';
      ctx.fillRect(mx + 9, my, 3, 8);
      ctx.fillStyle = '#fff';
      ctx.fillRect(mx + 2, my + 3, 2, 2);
      ctx.fillRect(mx + 7, my + 3, 2, 2);
      ctx.fillStyle = '#000';
      ctx.fillRect(mx + 2, my + 3, 1, 1);
      ctx.fillRect(mx + 7, my + 3, 1, 1);
      ctx.fillStyle = '#00b894';
      ctx.fillRect(mx + 3, my + 11, 6, 2);
    } else {
      var mglow = Math.sin(Date.now() / 300) * 2;
      ctx.fillStyle = '#111';
      ctx.fillRect(mx, my + mglow, 12, 14);
      ctx.fillStyle = '#636e72';
      ctx.fillRect(mx + 1, my + 1 + mglow, 10, 12);
      ctx.fillStyle = '#f1c40f';
      ctx.fillRect(mx + 9, my + mglow, 3, 8);
      ctx.fillStyle = '#fff';
      ctx.fillRect(mx + 2, my + 3 + mglow, 2, 2);
      ctx.fillRect(mx + 7, my + 3 + mglow, 2, 2);
      ctx.fillStyle = '#000';
      ctx.fillRect(mx + 2, my + 3 + mglow, 1, 1);
      ctx.fillRect(mx + 7, my + 3 + mglow, 1, 1);
      ctx.fillStyle = '#e17055';
      ctx.fillRect(mx + 3, my + 11 + mglow, 6, 2);
    }
  }

  if (boss) {
    if (boss.isBoss2) {
      var bx = boss.x + cx, by = boss.y + cy;
      if (boss.jumping) {
        ctx.fillStyle = boss.stun > 0 ? '#888' : '#6b21a8';
      } else {
        ctx.fillStyle = boss.stun > 0 ? '#888' : '#7c3aed';
      }
      ctx.fillRect(bx, by, 32, 32);
      ctx.fillStyle = '#9333ea';
      ctx.fillRect(bx + 2, by + 2, 28, 28);
      ctx.fillStyle = '#c084fc';
      ctx.fillRect(bx + 4, by + 6, 6, 6);
      ctx.fillRect(bx + 22, by + 6, 6, 6);
      ctx.fillStyle = '#000';
      ctx.fillRect(bx + 5, by + 7, 4, 4);
      ctx.fillRect(bx + 23, by + 7, 4, 4);
      ctx.fillStyle = '#6b21a8';
      ctx.fillRect(bx + 6, by + 22, 20, 3);
      ctx.fillStyle = '#fff';
      ctx.fillRect(bx + 8, by + 23, 3, 2);
      ctx.fillRect(bx + 14, by + 23, 3, 2);
      ctx.fillRect(bx + 20, by + 23, 3, 2);
      ctx.fillStyle = '#7c3aed';
      ctx.fillRect(bx - 4, by + 10, 6, 16);
      ctx.fillRect(bx + 30, by + 10, 6, 16);
      ctx.fillStyle = '#9333ea';
      ctx.fillRect(bx + 4, by + 32, 6, 4);
      ctx.fillRect(bx + 22, by + 32, 6, 4);
      if (boss.phase >= 1) {
        ctx.fillStyle = '#f39c12';
        ctx.fillRect(bx + 10, by - 4, 4, 6);
        ctx.fillRect(bx + 18, by - 4, 4, 6);
      }
      if (boss.phase >= 2) {
        ctx.fillStyle = '#f39c12';
        ctx.fillRect(bx - 2, by + 4, 4, 6);
        ctx.fillRect(bx + 30, by + 4, 4, 6);
      }
      if (boss.jumping) {
        ctx.fillStyle = 'rgba(124,58,237,0.3)';
        ctx.fillRect(bx - 4, by + 36, 40, 8);
      }
    } else {
      ctx.fillStyle = boss.stun > 0 ? '#888' : '#c0392b';
      ctx.fillRect(boss.x + cx, boss.y + cy, 28, 32);
      ctx.fillStyle = '#e74c3c';
      ctx.fillRect(boss.x + 2 + cx, boss.y + 2 + cy, 24, 28);

      ctx.fillStyle = boss.phase >= 2 ? '#f39c12' : boss.phase >= 1 ? '#e67e22' : '#fff';
      ctx.fillRect(boss.x + 5 + cx, boss.y + 6 + cy, 5, 5);
      ctx.fillRect(boss.x + 18 + cx, boss.y + 6 + cy, 5, 5);
      ctx.fillStyle = '#000';
      ctx.fillRect(boss.x + 6 + cx, boss.y + 7 + cy, 3, 3);
      ctx.fillRect(boss.x + 19 + cx, boss.y + 7 + cy, 3, 3);

      ctx.fillStyle = '#7f1d1d';
      ctx.fillRect(boss.x + 4 + cx, boss.y + 20 + cy, 20, 3);
      ctx.fillStyle = '#fff';
      ctx.fillRect(boss.x + 7 + cx, boss.y + 21 + cy, 2, 2);
      ctx.fillRect(boss.x + 12 + cx, boss.y + 21 + cy, 2, 2);
      ctx.fillRect(boss.x + 17 + cx, boss.y + 21 + cy, 2, 2);

      ctx.fillStyle = '#922b21';
      ctx.fillRect(boss.x - 4 + cx, boss.y + 10 + cy, 6, 16);
      ctx.fillRect(boss.x + 26 + cx, boss.y + 10 + cy, 6, 16);

      if (boss.phase >= 1) {
        ctx.fillStyle = '#f39c12';
        ctx.fillRect(boss.x + 8 + cx, boss.y - 4 + cy, 4, 6);
        ctx.fillRect(boss.x + 16 + cx, boss.y - 4 + cy, 4, 6);
      }
    }

    var bw = 60;
    var bfill = (boss.hp / boss.maxHp) * bw;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(240 - bw / 2, 10, bw, 8);
    ctx.fillStyle = boss.hp <= boss.maxHp * 0.3 ? '#e74c3c' : boss.isBoss2 ? '#9333ea' : '#e94560';
    ctx.fillRect(240 - bw / 2, 10, bfill, 8);
    ctx.fillStyle = '#fff';
    ctx.font = '8px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(boss.isBoss2 ? 'JEFE 2' : 'JEFE', 240, 8);
    ctx.textAlign = 'left';
  }

  for (var bpi = 0; bpi < bossProjectiles.length; bpi++) {
    var bpo = bossProjectiles[bpi];
    ctx.fillStyle = '#f39c12';
    ctx.beginPath();
    ctx.arc(bpo.x + cx, bpo.y + cy, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(bpo.x + cx, bpo.y + cy, 2, 0, Math.PI * 2);
    ctx.fill();
  }

  for (var swj = 0; swj < bossShockwaves.length; swj++) {
    var sw2 = bossShockwaves[swj];
    ctx.fillStyle = 'rgba(147,51,234,' + (sw2.life / 25) + ')';
    ctx.fillRect(sw2.x + cx - 6, sw2.y + cy - 4, 12, 8);
    ctx.fillStyle = 'rgba(255,255,255,' + (sw2.life / 25 * 0.6) + ')';
    ctx.fillRect(sw2.x + cx - 3, sw2.y + cy - 2, 6, 4);
  }

  for (var bi2 = breakEffects.length - 1; bi2 >= 0; bi2--) {
    var be = breakEffects[bi2];
    be.life--;
    if (be.life <= 0) { breakEffects.splice(bi2, 1); continue; }
    if (be.type === 'shock') {
      var sAlpha = be.life / 15;
      var sR = (15 - be.life) * 6;
      ctx.strokeStyle = 'rgba(147,51,234,' + sAlpha + ')';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(be.x + be.w / 2 + cx, be.y + cy, sR, 0, Math.PI * 2);
      ctx.stroke();
    } else if (be.col) {
      be.x += be.vx; be.y += be.vy; be.vy += 0.35;
      var pa = be.life / 18;
      ctx.fillStyle = be.col;
      ctx.globalAlpha = pa;
      ctx.fillRect(be.x + cx, be.y + cy, 4, 4);
      ctx.globalAlpha = 1;
    } else {
      var alpha = be.life / 20;
      for (var bsi = 0; bsi < 4; bsi++) {
        ctx.fillStyle = 'rgba(150,150,150,' + alpha + ')';
        ctx.fillRect(
          be.x + Math.random() * be.w + cx - 2,
          be.y + Math.random() * 10 - 5 + cy,
          4, 4
        );
      }
      ctx.fillStyle = 'rgba(200,200,200,' + (alpha * 0.5) + ')';
      ctx.fillRect(be.x + cx, be.y + cy, be.w, 10);
    }
  }

  if (flagObj) {
    ctx.fillStyle = '#aaa';
    ctx.fillRect(flagObj.x + 6 + cx, flagObj.y - 10 + cy, 2, 24);
    ctx.fillStyle = won ? '#00b894' : '#4ecdc4';
    ctx.fillRect(flagObj.x + 8 + cx, flagObj.y - 10 + cy, 10, 8);
  }

  if (checkpoint) {
    ctx.fillStyle = '#aaa';
    ctx.fillRect(checkpoint.x + 3 + cx, checkpoint.y - 8 + cy, 2, 20);
    ctx.fillStyle = checkpoint.active ? '#f39c12' : '#555';
    ctx.fillRect(checkpoint.x + 5 + cx, checkpoint.y - 8 + cy, 8, 6);
    if (!checkpoint.active) {
      ctx.fillStyle = '#fff';
      ctx.font = '6px monospace';
      ctx.textAlign = 'center';
      ctx.fillText('!', checkpoint.x + 9 + cx, checkpoint.y - 3 + cy);
      ctx.textAlign = 'left';
    } else {
      var cw = Math.sin(Date.now() / 200) * 1;
      ctx.fillStyle = '#f1c40f';
      ctx.fillRect(checkpoint.x + 5 + cw + cx, checkpoint.y - 8 + cy, 8, 6);

  }

  for (i = 0; i < dashTrail.length; i++) {

    ctx.fillRect(t.x + cx, t.y + cy, 12, 16);
    ctx.fillStyle = 'rgba(255,255,255,' + (a * 0.35) + ')';
    ctx.fillRect(t.x + 2 + cx, t.y + 2 + cy, 8, 12);
  }
  if (dashTimer > 0) {

  ctx.fillStyle = '#4ecdc4';
  ctx.fillRect(px + 2 + cx, py + 4 + cy, 8, 8);

  ctx.fillRect(px + 7 + cx, py + 2 + cy, 2, 2);
  ctx.fillStyle = '#6c5ce7';
  ctx.fillRect(px + 2 + cx, py - 1 + cy, 8, 2);

  var lo = (onGround && Math.abs(pvx) > 0) ? Math.sin(Date.now() / 80) * 2 : 0;
  ctx.fillRect(px + 2 + cx, py + 12 + cy, 3, 4 + lo);
  ctx.fillRect(px + 7 + cx, py + 12 + cy, 3, 4 - lo);

  if (hasDash) {
    var barW = 40;

    ctx.fillRect(10, 10, barW, 6);

    ctx.fillRect(10, 10, fill, 6);

  }

  if (hasWave) {

    ctx.fillStyle = 'rgba(255,255,255,0.2)';
    ctx.fillRect(10, 30, waveBarW, 6);

  }

  if (mercenary && mercenary.hired) {

  if (dead) {

  }

  if (won) {

    ctx.fillStyle = '#aaa';
    ctx.font = '16px monospace';
    ctx.fillText('Monedas: ' + score, 240, 175);
    ctx.fillText(isMobile ? 'Toca para continuar' : 'Presiona ENTER', 240, 210);
    ctx.textAlign = 'left';
  }

  if (showPlayerHealth && !sunDeath) {
    var phw = 60;
    var phfill = (playerHp / playerMaxHp) * phw;
    var psx = px + 6 + cx;
    var psy = py + cy;
    var phx = psx - phw / 2;
    phx = Math.max(2, Math.min(480 - phw - 2, phx));
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(phx, psy - 10, phw, 7);
    ctx.fillStyle = playerHp <= 25 ? '#e74c3c' : '#00b894';
    ctx.fillRect(phx, psy - 10, phfill, 7);
    ctx.fillStyle = '#fff';
    ctx.font = '7px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('HP: ' + playerHp, phx + phw / 2, psy - 12);

  if (false) {
    ctx.fillStyle = 'rgba(0,0,0,0.75)';

    ctx.font = '10px monospace';

  if (sunDeath) {
    var deathProgress = Math.min(1, (180 - sunDialogueTimer) / 120);
    ctx.fillStyle = 'rgba(0,0,0,' + (0.7 + deathProgress * 0.25) + ')';
    ctx.fillRect(0, 0, 480, 320);

    var sunDimR = 35 * (1 - deathProgress * 0.6);
    var sunDimAlpha = 1 - deathProgress * 0.7;
    ctx.fillStyle = 'rgba(243,156,18,' + sunDimAlpha + ')';
    ctx.beginPath();
    ctx.arc(240, 90, sunDimR, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(241,196,15,' + (sunDimAlpha * 0.7) + ')';
    ctx.beginPath();
    ctx.arc(240, 90, sunDimR * 0.65, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,' + (sunDimAlpha * 0.5) + ')';
    ctx.beginPath();
    ctx.arc(240, 90, sunDimR * 0.3, 0, Math.PI * 2);
    ctx.fill();

    for (var sdk = 0; sdk < 6; sdk++) {
      var rayA = sunRays * 0.5 + (sdk / 6) * Math.PI * 2;
      var rayAlpha2 = 0.15 * (1 - deathProgress);
      ctx.strokeStyle = 'rgba(243,156,18,' + rayAlpha2 + ')';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(240 + Math.cos(rayA) * (sunDimR + 3), 90 + Math.sin(rayA) * (sunDimR + 3));
      ctx.lineTo(240 + Math.cos(rayA) * (sunDimR + 40), 90 + Math.sin(rayA) * (sunDimR + 40));
      ctx.stroke();
    }

    if (sunParticles.length > 0) {
      for (var spk = 0; spk < sunParticles.length; spk++) {
        var sp2 = sunParticles[spk];
        var sa2 = (sp2.fade !== undefined ? sp2.fade : 1) * sunDimAlpha;
        if (sp2.type === 0) {
          ctx.fillStyle = 'rgba(255,255,235,' + sa2 + ')';
          ctx.beginPath();
          ctx.arc(sp2.x, sp2.y, sp2.size, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = 'rgba(255,236,180,' + (sa2 * 0.4) + ')';
          ctx.beginPath();
          ctx.arc(sp2.x, sp2.y, sp2.size * 2.2, 0, Math.PI * 2);
          ctx.fill();
        } else if (sp2.type === 1) {
          var grdD = ctx.createRadialGradient(sp2.x, sp2.y, 0, sp2.x, sp2.y, sp2.size * 2.2);
          grdD.addColorStop(0, 'rgba(255,224,120,' + sa2 + ')');
          grdD.addColorStop(0.35, 'rgba(245,170,40,' + (sa2 * 0.5) + ')');
          grdD.addColorStop(1, 'rgba(220,120,20,0)');
          ctx.fillStyle = grdD;
          ctx.beginPath();
          ctx.arc(sp2.x, sp2.y, sp2.size * 2.2, 0, Math.PI * 2);
          ctx.fill();
        } else {
          var grdD2 = ctx.createRadialGradient(sp2.x, sp2.y, 0, sp2.x, sp2.y, sp2.size * 3);
          grdD2.addColorStop(0, 'rgba(255,244,200,' + sa2 + ')');
          grdD2.addColorStop(0.18, 'rgba(255,190,70,' + (sa2 * 0.6) + ')');
          grdD2.addColorStop(0.5, 'rgba(235,135,25,' + (sa2 * 0.25) + ')');
          grdD2.addColorStop(1, 'rgba(205,90,15,0)');
          ctx.fillStyle = grdD2;
          ctx.beginPath();
          ctx.arc(sp2.x, sp2.y, sp2.size * 3, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    if (deathProgress > 0.3) {
      var textAlpha = Math.min(1, (deathProgress - 0.3) / 0.3);
      ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(243,156,18,' + textAlpha + ')';
      ctx.font = 'bold 18px monospace';
      ctx.fillText('LA ÚLTIMA LUZ', 240, 165);
      ctx.fillText('SE HA APAGADO', 240, 190);
      ctx.fillStyle = 'rgba(170,170,170,' + textAlpha + ')';
      ctx.font = '11px monospace';
      ctx.fillText(isMobile ? 'Toca para reiniciar' : 'Presiona ENTER', 240, 230);
      ctx.textAlign = 'left';
    }
  }
}

var touchState = { left: false, right: false, jump: false, dash: false, wave: false };
var isMobile = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;

var keySource = {};

function setKey(key, val, source) {
  if (val) {
    keySource[key] = source;
    keys[key] = true;
  } else if (keySource[key] === source) {
    keys[key] = false;
    delete keySource[key];
  }
}

var joystick = document.getElementById('joystick');
var joystickKnob = document.getElementById('joystick-knob');
var joystickActive = false;
var joystickTouchId = null;
var joystickRadius = 60;
var knobRadius = 24;
var joystickCenterX = 0;
var joystickCenterY = 0;

function updateJoystick(clientX, clientY) {
  var rect = joystick.getBoundingClientRect();
  joystickCenterX = rect.left + rect.width / 2;
  joystickCenterY = rect.top + rect.height / 2;
  var dx = clientX - joystickCenterX;
  var dy = clientY - joystickCenterY;
  var dist = Math.sqrt(dx * dx + dy * dy);
  var maxDist = joystickRadius - knobRadius;
  if (dist > maxDist) {
    dx = (dx / dist) * maxDist;
    dy = (dy / dist) * maxDist;
  }
  joystickKnob.style.left = (60 + dx) + 'px';
  joystickKnob.style.top = (60 + dy) + 'px';
  joystickKnob.style.transform = 'translate(-50%, -50%)';

  var threshold = 15;
  setKey('ArrowLeft', dx < -threshold, 'joystick');
  setKey('ArrowRight', dx > threshold, 'joystick');
  setKey('ArrowUp', dy < -threshold, 'joystick');
  setKey('Space', dy < -threshold, 'joystick');
}

function resetJoystick() {
  joystickKnob.style.left = '50%';
  joystickKnob.style.top = '50%';
  joystickKnob.style.transform = 'translate(-50%, -50%)';
  setKey('ArrowLeft', false, 'joystick');
  setKey('ArrowRight', false, 'joystick');
  setKey('ArrowUp', false, 'joystick');
  setKey('Space', false, 'joystick');
}

joystick.addEventListener('touchstart', function(e) {
  e.preventDefault();
  var t = e.changedTouches[0];
  joystickActive = true;
  joystickTouchId = t.identifier;
  updateJoystick(t.clientX, t.clientY);
}, { passive: false });

joystick.addEventListener('touchmove', function(e) {
  e.preventDefault();
  if (!joystickActive) return;
  for (var i = 0; i < e.changedTouches.length; i++) {
    var t = e.changedTouches[i];
    if (t.identifier === joystickTouchId) {
      updateJoystick(t.clientX, t.clientY);
      break;
    }
  }
}, { passive: false });

joystick.addEventListener('touchend', function(e) {
  e.preventDefault();
  for (var i = 0; i < e.changedTouches.length; i++) {
    if (e.changedTouches[i].identifier === joystickTouchId) {
      joystickActive = false;
      joystickTouchId = null;
      resetJoystick();
      break;
    }
  }
}, { passive: false });

joystick.addEventListener('touchcancel', function(e) {
  e.preventDefault();
  for (var i = 0; i < e.changedTouches.length; i++) {
    if (e.changedTouches[i].identifier === joystickTouchId) {
      joystickActive = false;
      joystickTouchId = null;
      resetJoystick();
      break;
    }
  }
}, { passive: false });

function bindTouchBtn(id, stateKey) {
  var btn = document.getElementById(id);
  if (!btn) return;
  btn.addEventListener('touchstart', function(e) {
    e.preventDefault();
    touchState[stateKey] = true;
    if (stateKey === 'dash') { zPressed = true; dashHeld = true; }
    if (stateKey === 'wave') xPressed = true;
    if (stateKey === 'jump') { setKey('Space', true, 'btn-jump'); setKey('ArrowUp', true, 'btn-jump'); }
  }, { passive: false });
  btn.addEventListener('touchend', function(e) {
    e.preventDefault();
    touchState[stateKey] = false;
    if (stateKey === 'dash') { zPressed = false; dashHeld = false; }
    if (stateKey === 'wave') xPressed = false;
    if (stateKey === 'jump') { setKey('Space', false, 'btn-jump'); setKey('ArrowUp', false, 'btn-jump'); }
  }, { passive: false });
  btn.addEventListener('touchcancel', function(e) {
    e.preventDefault();
    touchState[stateKey] = false;
    if (stateKey === 'dash') { zPressed = false; dashHeld = false; }
    if (stateKey === 'wave') xPressed = false;
    if (stateKey === 'jump') { setKey('Space', false, 'btn-jump'); setKey('ArrowUp', false, 'btn-jump'); }
  }, { passive: false });
}

function bindRestartBtn(id) {
  var btn = document.getElementById(id);

  btn.addEventListener('touchstart', function(e) {
    e.preventDefault();
    if (dead || won || sunDeath) {

        loadLevel(currentLevel + 1);
        won = false;
      } else {

      }
    }
  }, { passive: false });
}

    e.preventDefault();
    keys.KeyE = false;
  }, { passive: false });
})();

restartGame();
setInterval(function() {
  update();
  render();
  if (levels[currentLevel] && levels[currentLevel].skyFade && flagObj) {
    var fadeV = 1 - skyFadeT();
    bgmSky.volume = baseVol * fadeV;
  } else if (levels[currentLevel] && (levels[currentLevel].galaxy || levels[currentLevel].secret)) {
    bgm.volume = baseVol;
  } else if (bgm.volume !== baseVol) {
    bgm.volume = baseVol;
  }
  if (frameShake > 0.5) {
    frameShake *= 0.85;
    var fsx = (Math.random() - 0.5) * frameShake;
    var fsy = (Math.random() - 0.5) * frameShake;
    canvas.style.transform = 'translate(' + fsx + 'px,' + fsy + 'px)';
  } else {
    frameShake = 0;
    if (canvas.style.transform) canvas.style.transform = '';
  }
}, 1000 / 60);
  </script>
</body>
