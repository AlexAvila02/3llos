<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Pixel Game</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #111; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; height: 100dvh; font-family: monospace; color: white; overflow: hidden; touch-action: none; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
    canvas { border: 2px solid #4ecdc4; image-rendering: pixelated; max-width: 100vw; max-height: 55vh; }
    .info { margin-top: 10px; font-size: 13px; color: #888; text-align: center; padding: 0 10px; }
    .info-desktop { display: block; }
    .info-mobile { display: none; }
    a.back { position: fixed; top: 15px; right: 25px; width: 32px; height: 32px; background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3); border-radius: 50%; display: flex; align-items: center; justify-content: center; z-index: 100; }
    #back-icon { width: 14px; height: 14px; image-rendering: pixelated; }
    #volume-ctrl { position: fixed; top: 12px; right: 65px; display: flex; align-items: center; gap: 6px; z-index: 100; }
    #mute-btn { background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3); width: 32px; height: 32px; border-radius: 50%; cursor: pointer; position: relative; overflow: hidden; }
    #mute-icon { width: 20px; height: 20px; image-rendering: pixelated; }
    #vol-slider { width: 70px; height: 6px; -webkit-appearance: none; appearance: none; background: rgba(255,255,255,0.2); outline: none; cursor: pointer; border: none; }
    #vol-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 10px; height: 10px; background: #4ecdc4; cursor: pointer; border: none; }
    #vol-slider::-moz-range-thumb { width: 10px; height: 10px; background: #4ecdc4; cursor: pointer; border: none; }
    #vol-slider::-webkit-slider-runnable-track { height: 6px; background: rgba(255,255,255,0.2); }
    #vol-slider::-moz-range-track { height: 6px; background: rgba(255,255,255,0.2); border: none; }

    #touch-controls {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 45vh;
      pointer-events: none;
      z-index: 50;
    }
    .touch-btn {
      position: absolute;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: monospace;
      font-weight: bold;
      color: #fff;
      pointer-events: auto;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }
    .touch-btn:active, .touch-btn.active {
      filter: brightness(1.4);
      transform: scale(0.92);
    }
    #joystick {
      position: absolute;
      left: 15px;
      bottom: 15px;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: rgba(78, 205, 196, 0.15);
      border: 2px solid rgba(78, 205, 196, 0.5);
      pointer-events: auto;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }
    #joystick-knob {
      position: absolute;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(78, 205, 196, 0.55);
      border: 2px solid rgba(78, 205, 196, 0.8);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      transition: none;
    }
    .btn-jump {
      right: 10px;
      bottom: 90px;
      width: 80px;
      height: 80px;
      background: rgba(0, 184, 148, 0.45);
      border: 2px solid rgba(0, 184, 148, 0.7);
    }
    .btn-jump::after { content: '▲'; font-size: 28px; }
    .btn-dash {
      right: 100px;
      bottom: 130px;
      width: 60px;
      height: 60px;
      background: rgba(233, 69, 96, 0.45);
      border: 2px solid rgba(233, 69, 96, 0.7);
      font-size: 14px !important;
    }
    .btn-dash::after { content: 'Z'; font-size: 18px; }
    .btn-wave {
      right: 10px;
      bottom: 190px;
      width: 60px;
      height: 60px;
      background: rgba(255, 159, 67, 0.45);
      border: 2px solid rgba(255, 159, 67, 0.7);
    }
    .btn-wave::after { content: 'X'; font-size: 18px; }
    .btn-restart {
      right: 100px;
      bottom: 30px;
      width: 50px;
      height: 50px;
      background: rgba(255, 255, 255, 0.2);
      border: 2px solid rgba(255, 255, 255, 0.4);
    }
    .btn-restart::after { content: 'R'; font-size: 16px; }
    .btn-equip {
      right: 160px;
      bottom: 30px;
      width: 50px;
      height: 50px;
      background: rgba(243, 156, 18, 0.3);
      border: 2px solid rgba(243, 156, 18, 0.5);
      display: none;
    }
    .btn-equip::after { content: 'E'; font-size: 16px; }

    @media (pointer: coarse), (max-width: 768px) {
      #touch-controls { display: block; }
      .info-desktop { display: none; }
      .info-mobile { display: block; }
      canvas { max-height: 48vh; }
      a.back { top: 8px; right: 12px; width: 28px; height: 28px; }
      #back-icon { width: 12px; height: 12px; }
      #volume-ctrl { top: 8px; right: 50px; gap: 4px; }
      #mute-btn { width: 28px; height: 28px; }
      #mute-icon { width: 16px; height: 16px; }
      #vol-slider { width: 50px; }
    }
  </style>
</head>
<body>
  <a class="back" href="../../index.html"><canvas id="back-icon" width="7" height="7"></canvas></a>
  <audio id="bgm" src="../../assets/audio/Pixel Adventure main theme.mpeg" loop autoplay></audio>
  <audio id="bgm-sky" src="../../assets/audio/nivel11.mp3" loop></audio>
  <audio id="bgm-secret" src="../../assets/audio/secreto.mpeg" loop></audio>
  <audio id="bgm-galaxy" src="../../assets/audio/proxima_centauri.mp3" loop></audio>
  <div id="volume-ctrl">
    <button id="mute-btn"><canvas id="mute-icon" width="10" height="10"></canvas></button>
    <input type="range" id="vol-slider" min="0" max="100" value="70">
  </div>
  <canvas id="c" width="480" height="320"></canvas>
  <div class="info info-desktop">Flechas/WASD: mover | Space/Arriba: saltar | Z: dash | X: onda expansiva | R: reiniciar</div>
  <div class="info info-mobile">Usa los botones táctiles para jugar</div>

  <div id="touch-controls">
    <div id="joystick"><div id="joystick-knob"></div></div>
    <div class="touch-btn btn-jump" id="btn-jump"></div>
    <div class="touch-btn btn-dash" id="btn-dash"></div>
    <div class="touch-btn btn-wave" id="btn-wave"></div>
    <div class="touch-btn btn-restart" id="btn-restart"></div>
    <div class="touch-btn btn-equip" id="btn-equip"></div>
  </div>
  <script type="module" src="js/game.js"></script>
</body>
</html>
