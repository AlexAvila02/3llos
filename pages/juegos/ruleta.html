<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruleta - Papubanda</title>
    <link rel="stylesheet" href="css/juegos-common.css">
    <link rel="stylesheet" href="css/ruleta.css">
</head>
<body>
    <div class="wave-container">
        <div class="wave"></div>
        <div class="wave"></div>
        <div class="wave"></div>
        <div class="wave"></div>
    </div>

    <!-- Menú hamburguesa -->
    <div class="hamburger-menu" onclick="toggleSidebar()">
        <div class="hamburger-line"></div>
        <div class="hamburger-line"></div>
        <div class="hamburger-line"></div>
    </div>

    <!-- Overlay del sidebar -->
    <div class="sidebar-overlay" onclick="toggleSidebar()"></div>

    <!-- Sidebar -->
    <div class="sidebar">
        <a href="../../index.html" class="sidebar-item">Inicio</a>
        <a href="ruleta.html" class="sidebar-item">Ruleta</a>
        <a href="teclado.html" class="sidebar-item">Test Teclado</a>
        <a href="mando.html" class="sidebar-item">Test Mando</a>
        <a href="tierlist.html" class="sidebar-item">Tier List</a>

        <div class="theme-section">
            <p class="theme-label">Modos</p>
            <div class="theme-buttons">
                <button class="theme-btn" data-theme="default" style="background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);"></button>
                <button class="theme-btn" data-theme="dark" style="background: linear-gradient(135deg, #0f0f0f 0%, #1a1a1a 50%, #0a0a0a 100%);"></button>
                <button class="theme-btn" data-theme="purple" style="background: linear-gradient(135deg, #1a0a2e 0%, #2d1b4e 50%, #1a0f3d 100%);"></button>
                <button class="theme-btn" data-theme="green" style="background: linear-gradient(135deg, #0a2e1a 0%, #1b4e2d 50%, #0f3d1a 100%);"></button>
                <button class="theme-btn" data-theme="red" style="background: linear-gradient(135deg, #2e0a0a 0%, #4e1b1b 50%, #3d0f0f 100%);"></button>
                <button class="theme-btn" data-theme="orange" style="background: linear-gradient(135deg, #2e1a0a 0%, #4e2d1b 50%, #3d1f0f 100%);"></button>
            </div>
        </div>

        <div class="links-section" style="margin-top: 20px; padding: 15px 20px; border-top: 1px solid rgba(255,255,255,0.1);">
            <p class="links-label" style="color: rgba(255,255,255,0.8); font-size: 16px; margin: 0 0 12px 0; font-weight: 500;">Links</p>
            <a href="https://drive.google.com/drive/folders/1KdsfAYtp-uTZXhpbL9Y9tEfNvGqx_Dtn" target="_blank" class="sidebar-item" style="margin: 5px 0; font-size: 14px;">Excels</a>
            <a href="https://balatro-mod-manager.dasguney.com/download" target="_blank" class="sidebar-item" style="margin: 5px 0; font-size: 14px;">Balatro Mod</a>
            <a href="https://fast.com/es/" target="_blank" class="sidebar-item" style="margin: 5px 0; font-size: 14px;">Internet Velocidad</a>
        </div>
    </div>

    <a href="../../index.html" style="position: fixed; top: 20px; right: 30px; font-size: 40px; color: white; text-decoration: none; z-index: 10000;" onclick="event.preventDefault(); playCloseSound(); setTimeout(() => window.location.href='../../index.html', 200);">&times;</a>

    <div class="container">
        <h1 class="animated-title"><span style="animation-delay: 0s">R</span><span style="animation-delay: 0.1s">u</span><span style="animation-delay: 0.2s">l</span><span style="animation-delay: 0.3s">e</span><span style="animation-delay: 0.4s">t</span><span style="animation-delay: 0.5s">a</span></h1>

        <div class="wheel-section">
            <div class="wheel-container">
                <div class="pointer"></div>
                <canvas id="canvas" width="400" height="400"></canvas>
                <button id="spinBtn" class="center-spin-btn" onclick="spin()"><span class="btn-text">Girar</span></button>
            </div>

            <div id="result" class="result">
                <div class="result-label">Resultado</div>
                <div id="resultText" class="result-text"></div>
            </div>
        </div>

        <div class="auto-delete-toggle" style="margin: 20px 0; justify-content: center;">
            <label class="switch">
                <input type="checkbox" id="autoDeleteToggle" checked>
                <span class="slider"></span>
            </label>
            <span class="toggle-label">Eliminar ganador automáticamente</span>
        </div>

        <div class="controls">
            <div class="input-group">
                <label for="numOptions">Cantidad de opciones:</label>
                <div class="number-selector">
                    <input type="number" id="numOptions" min="2" max="20" value="2" onchange="syncFromInput()">
                    <select id="numOptionsSelect" onchange="syncFromSelect()">
                        <option value="20">20</option>
                        <option value="19">19</option>
                        <option value="18">18</option>
                        <option value="17">17</option>
                        <option value="16">16</option>
                        <option value="15">15</option>
                        <option value="14">14</option>
                        <option value="13">13</option>
                        <option value="12">12</option>
                        <option value="11">11</option>
                        <option value="10">10</option>
                        <option value="9">9</option>
                        <option value="8">8</option>
                        <option value="7">7</option>
                        <option value="6">6</option>
                        <option value="5">5</option>
                        <option value="4">4</option>
                        <option value="3">3</option>
                        <option value="2" selected>2</option>
                    </select>
                </div>
            </div>

            <div id="optionsContainer" class="options-container">
                <!-- Los inputs se generarán dinámicamente -->
            </div>

            <button onclick="addNewOption()" style="
                margin-top: 10px;
                padding: 8px 16px;
                background: rgba(100, 200, 100, 0.8);
                color: white;
                border: none;
                border-radius: 6px;
                cursor: pointer;
                font-size: 14px;
                font-weight: bold;
                transition: all 0.2s ease;
            " onmouseover="this.style.background='rgba(80, 180, 80, 1)'" onmouseout="this.style.background='rgba(100, 200, 100, 0.8)'">+ Agregar opción</button>
        </div>
    </div>

    <script src="../../js/shared-ui.js"></script>
    <script src="js/ruleta.js"></script>
</body>
</html>
