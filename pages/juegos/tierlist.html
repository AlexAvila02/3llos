<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tier List Maker</title>
    <link rel="stylesheet" href="css/juegos-common.css">
    <link rel="stylesheet" href="css/tierlist.css">
</head>
<body>
    <!-- Partículas flotantes -->
    <div class="particles-container" id="particlesContainer"></div>

    <!-- Menú hamburguesa -->
    <div class="hamburger-menu" onclick="toggleSidebar()">
        <div class="hamburger-line"></div>
        <div class="hamburger-line"></div>
        <div class="hamburger-line"></div>
    </div>

    <!-- Overlay del sidebar -->
    <div class="sidebar-overlay" onclick="toggleSidebar()"></div>

    <!-- Sidebar -->
    <div class="sidebar">
        <a href="../../index.html" class="sidebar-item">Inicio</a>
        <a href="ruleta.html" class="sidebar-item">Ruleta</a>
        <a href="teclado.html" class="sidebar-item">Test Teclado</a>
        <a href="mando.html" class="sidebar-item">Test Mando</a>
        <a href="tierlist.html" class="sidebar-item">Tier List</a>

        <div class="theme-section">
            <p class="theme-label">Modos</p>
            <div class="theme-buttons">
                <button class="theme-btn" data-theme="default" style="background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);"></button>
                <button class="theme-btn" data-theme="dark" style="background: linear-gradient(135deg, #0f0f0f 0%, #1a1a1a 50%, #0a0a0a 100%);"></button>
                <button class="theme-btn" data-theme="purple" style="background: linear-gradient(135deg, #1a0a2e 0%, #2d1b4e 50%, #1a0f3d 100%);"></button>
                <button class="theme-btn" data-theme="green" style="background: linear-gradient(135deg, #0a2e1a 0%, #1b4e2d 50%, #0f3d1a 100%);"></button>
                <button class="theme-btn" data-theme="red" style="background: linear-gradient(135deg, #2e0a0a 0%, #4e1b1b 50%, #3d0f0f 100%);"></button>
                <button class="theme-btn" data-theme="orange" style="background: linear-gradient(135deg, #2e1a0a 0%, #4e2d1b 50%, #3d1f0f 100%);"></button>
            </div>
        </div>

        <div class="links-section" style="margin-top: 20px; padding: 15px 20px; border-top: 1px solid rgba(255,255,255,0.1);">
            <p class="links-label" style="color: rgba(255,255,255,0.8); font-size: 16px; margin: 0 0 12px 0; font-weight: 500;">Links</p>
            <a href="https://drive.google.com/drive/folders/1KdsfAYtp-uTZXhpbL9Y9tEfNvGqx_Dtn" target="_blank" class="sidebar-item" style="margin: 5px 0; font-size: 14px;">Excels</a>
            <a href="https://balatro-mod-manager.dasguney.com/download" target="_blank" class="sidebar-item" style="margin: 5px 0; font-size: 14px;">Balatro Mod</a>
            <a href="https://fast.com/es/" target="_blank" class="sidebar-item" style="margin: 5px 0; font-size: 14px;">Internet Velocidad</a>
        </div>
    </div>

    <a href="../../index.html" style="position: fixed; top: 20px; right: 30px; font-size: 40px; color: white; text-decoration: none; z-index: 10000;" onclick="event.preventDefault(); playCloseSound(); setTimeout(() => window.location.href='../../index.html', 200);">&times;</a>

    <div class="container">
        <h1 class="animated-title">
            <span style="animation-delay: 0s">T</span><span style="animation-delay: 0.1s">i</span><span style="animation-delay: 0.2s">e</span><span style="animation-delay: 0.3s">r</span><span style="animation-delay: 0.35s">&nbsp;</span><span style="animation-delay: 0.4s">L</span><span style="animation-delay: 0.5s">i</span><span style="animation-delay: 0.6s">s</span><span style="animation-delay: 0.7s">t</span><span style="animation-delay: 0.75s">&nbsp;</span><span style="animation-delay: 0.8s">M</span><span style="animation-delay: 0.9s">a</span><span style="animation-delay: 1s">k</span><span style="animation-delay: 1.1s">e</span><span style="animation-delay: 1.2s">r</span>
        </h1>

        <div class="controls">
            <div class="control-group">
                <span class="control-label">Filas:</span>
                <button class="btn" onclick="addRow()">➕ Añadir</button>
                <button class="btn btn-danger" onclick="removeLastRow()">➖ Eliminar</button>
            </div>
            <div class="control-group">
                <span class="control-label">Imágenes:</span>
                <label for="imageUpload" class="file-label">Subir</label>
                <input type="file" id="imageUpload" multiple accept="image/*" onchange="handleImageUpload(event)">
                <button class="btn" id="selectModeBtn" onclick="toggleSelectMode()">Seleccionar</button>
                <button class="btn btn-danger" id="deleteSelectedBtn" onclick="deleteSelectedImages()" style="display: none;">Eliminar seleccionadas</button>
                <button class="btn btn-danger" onclick="clearAllImages()">Limpiar todo</button>
                <button class="btn" onclick="resetToDefault()">Reset</button>
                <button class="btn" onclick="exportTierList()">Exportar</button>
            </div>
        </div>

        <div class="tierlist-container" id="tierlist">
            <!-- Las filas se generan dinámicamente -->
        </div>

        <div class="image-pool">
            <h2>📦 Imágenes Disponibles</h2>
            <div class="pool-content" id="imagePool">
                <!-- Las imágenes subidas aparecen aquí -->
            </div>
        </div>
    </div>

    <div class="sync-status" style="display: none;">
        <div class="sync-indicator"></div>
        <span>Modo local</span>
    </div>

    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <script src="../../js/shared-ui.js"></script>
    <script src="js/tierlist.js"></script>
</body>
</html>
