<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>el violador</title>
<style>
body {
background: linear-gradient(135deg, #1a0000 0%, #330000 50%, #1a0000 100%);
color: #ff0000;
display: flex;
justify-content: center;
align-items: center;
height: 100vh;
margin: 0;
font-family: 'Courier New', monospace;
font-size: 72px;
position: relative;
overflow: hidden;
}

.violador-title {
position: relative;
z-index: 10;
animation: alertPulse 1s ease-in-out infinite;
text-shadow: 0 0 10px #ff0000, 0 0 20px #ff0000, 0 0 30px #ff0000;
}

@keyframes alertPulse {
0%, 100% { 
transform: scale(1);
opacity: 1;
}
50% { 
transform: scale(1.05);
opacity: 0.8;
}
}

.alert-overlay {
position: absolute;
width: 100%;
height: 100%;
background: repeating-linear-gradient(
0deg,
rgba(255, 0, 0, 0.03),
rgba(255, 0, 0, 0.03) 1px,
transparent 1px,
transparent 3px
);
animation: scan 2s linear infinite;
pointer-events: none;
}

@keyframes scan {
0% { transform: translateY(-100%); }
100% { transform: translateY(100%); }
}

.warning-particle {
position: absolute;
width: 4px;
height: 4px;
background: #ff0000;
border-radius: 50%;
box-shadow: 0 0 6px #ff0000;
animation: warningFloat 3s ease-in-out infinite;
}

@keyframes warningFloat {
0%, 100% { 
transform: translateY(0) translateX(0);
opacity: 0.6;
}
50% { 
transform: translateY(-30px) translateX(10px);
opacity: 1;
}
}

.alert-bar {
position: absolute;
width: 100%;
height: 2px;
background: linear-gradient(90deg, transparent, #ff0000, transparent);
animation: alertBar 2s linear infinite;
}

@keyframes alertBar {
0% { transform: translateX(-100%); }
100% { transform: translateX(100%); }
}

.siren-light {
position: absolute;
width: 300px;
height: 300px;
border-radius: 50%;
background: radial-gradient(circle, rgba(255,0,0,0.2) 0%, transparent 70%);
animation: sirenPulse 1.5s ease-in-out infinite;
pointer-events: none;
}

@keyframes sirenPulse {
0%, 100% { 
transform: scale(1);
opacity: 0.3;
}
50% { 
transform: scale(1.5);
opacity: 0.6;
}
}

.number-33 {
position: absolute;
bottom: 100px;
font-size: 200px;
color: #ff0000;
font-weight: bold;
animation: alertPulse 1s ease-in-out infinite;
text-shadow: 0 0 20px #ff0000, 0 0 40px #ff0000, 0 0 60px #ff0000;
}

@keyframes numberGlow {
0%, 100% { 
opacity: 0.7;
text-shadow: 0 0 20px #ff0000, 0 0 40px #ff0000;
}
50% { 
opacity: 1;
text-shadow: 0 0 40px #ff0000, 0 0 80px #ff0000, 0 0 120px #ff0000;
}
}
</style>
</head>
<body>
<a href="../../index.html" style="position: fixed; top: 20px; right: 30px; font-size: 40px; color: white; text-decoration: none; z-index: 10000;" onclick="event.preventDefault(); playCloseSound(); setTimeout(() => window.location.href='../../index.html', 200);">&times;</a>

<div class="alert-overlay"></div>
<div class="siren-light" style="top: 10%; left: 10%;"></div>
<div class="siren-light" style="top: 10%; right: 10%; animation-delay: 0.75s;"></div>
<div class="siren-light" style="bottom: 10%; left: 50%; transform: translateX(-50%); animation-delay: 0.375s;"></div>

<div class="alert-bar" style="top: 20%;"></div>
<div class="alert-bar" style="top: 50%; animation-delay: 0.5s;"></div>
<div class="alert-bar" style="top: 80%; animation-delay: 1s;"></div>

<div class="violador-title">el violador</div>
<div class="number-33">33</div>

<script>
// Crear partículas de advertencia
function createWarningParticle() {
const particle = document.createElement('div');
particle.className = 'warning-particle';
particle.style.left = Math.random() * window.innerWidth + 'px';
particle.style.top = Math.random() * window.innerHeight + 'px';
particle.style.animationDelay = Math.random() * 3 + 's';
particle.style.animationDuration = (Math.random() * 2 + 2) + 's';
document.body.appendChild(particle);
}

// Inicializar partículas
for(let i = 0; i < 30; i++) {
createWarningParticle();
}

function playCloseSound() {
const audioContext = new (window.AudioContext || window.webkitAudioContext)();
const oscillator = audioContext.createOscillator();
const gainNode = audioContext.createGain();
oscillator.connect(gainNode);
gainNode.connect(audioContext.destination);
oscillator.frequency.setValueAtTime(600, audioContext.currentTime);
oscillator.frequency.linearRampToValueAtTime(400, audioContext.currentTime + 0.15);
gainNode.gain.setValueAtTime(0.2, audioContext.currentTime);
gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.15);
oscillator.start(audioContext.currentTime);
oscillator.stop(audioContext.currentTime + 0.15);
}
</script>
</body>
</html>
