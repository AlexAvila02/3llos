<!DOCTYPE html>
<html lang="es">
<head>
    <title>La tipica</title>
    <style>
        body {
            background: linear-gradient(180deg, #ff6b35 0%, #f7931e 50%, #ffd93d 100%);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-size: 100px;
            margin: 0;
            font-family: Arial, sans-serif;
            overflow: hidden;
            position: relative;
        }
        
        .title {
            position: relative;
            z-index: 10;
            animation: typicalBounce 2s ease-in-out infinite;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.3);
        }
        
        @keyframes typicalBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        
        .bubble {
            position: absolute;
            bottom: -100px;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.8), rgba(255, 255, 255, 0.2));
            border-radius: 50%;
            animation: float 10s infinite linear;
            box-shadow: inset -5px -5px 10px rgba(0,0,0,0.1);
        }
        
        @keyframes float {
            0% { bottom: -100px; opacity: 1; transform: translateX(0); }
            100% { bottom: 100vh; opacity: 0; transform: translateX(50px); }
        }
        
        .folk-pattern {
            position: absolute;
            font-size: 50px;
            opacity: 0.4;
            animation: folkRotate 8s linear infinite;
        }
        
        @keyframes folkRotate {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.2); }
            100% { transform: rotate(360deg) scale(1); }
        }
        
        .sun-ray {
            position: absolute;
            width: 2px;
            height: 200px;
            background: linear-gradient(to bottom, rgba(255,255,255,0.8), transparent);
            animation: rayPulse 3s ease-in-out infinite;
        }
        
        @keyframes rayPulse {
            0%, 100% { opacity: 0.3; transform: scaleY(1); }
            50% { opacity: 0.8; transform: scaleY(1.2); }
        }
    </style>
</head>
<body>
    <a href="../../index.html" style="position: fixed; top: 20px; right: 30px; font-size: 40px; color: white; text-decoration: none; z-index: 10000;" onclick="event.preventDefault(); playCloseSound(); setTimeout(() => window.location.href='../../index.html', 200);">&times;</a>
    
    <div class="title">🍊 La tipica 🍊</div>
    
    <div class="bubble" style="width: 40px; height: 40px; left: 10%; animation-delay: 0s;"></div>
    <div class="bubble" style="width: 60px; height: 60px; left: 20%; animation-delay: 2s;"></div>
    <div class="bubble" style="width: 30px; height: 30px; left: 30%; animation-delay: 4s;"></div>
    <div class="bubble" style="width: 50px; height: 50px; left: 40%; animation-delay: 1s;"></div>
    <div class="bubble" style="width: 35px; height: 35px; left: 50%; animation-delay: 3s;"></div>
    <div class="bubble" style="width: 45px; height: 45px; left: 60%; animation-delay: 5s;"></div>
    <div class="bubble" style="width: 55px; height: 55px; left: 70%; animation-delay: 0.5s;"></div>
    <div class="bubble" style="width: 25px; height: 25px; left: 80%; animation-delay: 2.5s;"></div>
    
    <script>
        // Crear patrones folclóricos
        function createFolkPattern() {
            const pattern = document.createElement('div');
            pattern.className = 'folk-pattern';
            const oranges = ['🍊', '🟠', '🧡', '🍋'];
            pattern.textContent = oranges[Math.floor(Math.random() * oranges.length)];
            pattern.style.left = Math.random() * window.innerWidth + 'px';
            pattern.style.top = Math.random() * window.innerHeight + 'px';
            pattern.style.animationDuration = (Math.random() * 5 + 5) + 's';
            pattern.style.animationDelay = Math.random() * 2 + 's';
            document.body.appendChild(pattern);
        }
        
        // Crear rayos de sol
        function createSunRay() {
            const ray = document.createElement('div');
            ray.className = 'sun-ray';
            ray.style.left = Math.random() * window.innerWidth + 'px';
            ray.style.top = '0px';
            ray.style.animationDelay = Math.random() * 2 + 's';
            document.body.appendChild(ray);
        }
        
        // Inicializar elementos
        for(let i = 0; i < 8; i++) createFolkPattern();
        for(let i = 0; i < 15; i++) createSunRay();
        
        function playCloseSound() {
          const audioContext = new (window.AudioContext || window.webkitAudioContext)();
          const oscillator = audioContext.createOscillator();
          const gainNode = audioContext.createGain();
          oscillator.connect(gainNode);
          gainNode.connect(audioContext.destination);
          oscillator.frequency.setValueAtTime(600, audioContext.currentTime);
          oscillator.frequency.linearRampToValueAtTime(400, audioContext.currentTime + 0.15);
          gainNode.gain.setValueAtTime(0.2, audioContext.currentTime);
          gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.15);
          oscillator.start(audioContext.currentTime);
          oscillator.stop(audioContext.currentTime + 0.15);
        }
    </script>
</body>
</html>
