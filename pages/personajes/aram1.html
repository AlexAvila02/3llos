<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Próximamente</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: flex-start;
            font-family: Arial, sans-serif;
        }
        .proximamente {            padding: 20px 0 0 20px;
            font-size: 20px;
            color: white;
            text-align: left;
        }

        .images-container {
            margin: 100px 0 0 20px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        .images-container img {
            max-width: 726px;
            height: auto;
            border: 2px solid white;
            border-radius: 10px;
        }
        .images-container p {
            color: white;
            font-size: 18px;
            margin: 10px 0 0 0;
            text-align: center;
            width: 100%;
        }

    </style>
</head>
<body>
  <a href="#" style="position: fixed; top: 20px; right: 30px; font-size: 40px; color: white; text-decoration: none; z-index: 10000;" onclick="event.preventDefault(); playCloseSound(); setTimeout(() => history.back(), 200);">&times;</a>
    <div class="proximamente">Se jugo 2 veces el aram, la primera vez llegamos a la final, la segunda perdimos a la primera y ganamos las otras 2</div>
        <div class="images-container">
            <img src="../../assets/images/aram2.png" alt="Aram 2">
            <img src="../../assets/images/aram1.png" alt="Aram 1">
        </div>
    <script>
        function playCloseSound() {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            oscillator.frequency.setValueAtTime(600, audioContext.currentTime);
            oscillator.frequency.linearRampToValueAtTime(400, audioContext.currentTime + 0.15);
            gainNode.gain.setValueAtTime(0.2, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.15);
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.15);
        }
    </script>
    </body>
</html>
