<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
<title>Arroz</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(ellipse at bottom, #1a0a0a 0%, #050505 70%);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Arial Black', sans-serif;
            position: relative;
        }
        
        .title {
            position: absolute;
            color: rgba(255, 100, 0, 0.1);
            font-size: 20vw;
            z-index: 0;
            user-select: none;
            text-transform: uppercase;
            pointer-events: none;
            animation: titleGlow 4s ease-in-out infinite;
        }
        
        @keyframes titleGlow {
            0%, 100% { color: rgba(255, 100, 0, 0.1); text-shadow: 0 0 30px rgba(255, 100, 0, 0.3); }
            50% { color: rgba(255, 150, 0, 0.15); text-shadow: 0 0 50px rgba(255, 150, 0, 0.5); }
        }
        
        .text-message {
            position: absolute;
            color: rgba(255, 200, 100, 0.9);
            font-size: 2.5vw;
            text-align: center;
            z-index: 10;
            max-width: 90%;
            padding: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8), 0 0 20px rgba(255, 100, 0, 0.5);
            animation: textPulse 3s ease-in-out infinite;
        }
        
        @keyframes textPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }
        
        .rice-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        
        .grain {
            position: absolute;
            width: 5px;
            height: 10px;
            background-color: #ffffff;
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            opacity: 0;
            animation: fall-and-burn linear forwards;
        }
        
        @keyframes fall-and-burn {
            0% {
                transform: translateY(-20px) rotate(0deg);
                background-color: #ffffff;
                opacity: 0;
            }
            5% { opacity: 1; }
            25% { background-color: #fffde7; box-shadow: 0 0 5px #ffd700; }
            50% {
                background-color: #ffcc00;
                box-shadow: 0 0 15px #ff4500, 0 0 30px #ff8c00, 0 0 45px #ffa500;
            }
            70% {
                background-color: #ff4500;
                box-shadow: 0 0 20px #ff0000, 0 0 40px #ff4500, 0 0 60px #ff6b35;
            }
            90% {
                background-color: #1a1a1a;
                box-shadow: none;
                opacity: 1;
                transform: translateY(85vh) rotate(720deg) scale(0.8);
            }
            100% {
                transform: translateY(110vh) rotate(900deg) scale(0.5);
                background-color: #000000;
                opacity: 0;
            }
        }
        
        .spark {
            position: absolute;
            width: 4px;
            height: 4px;
            background-color: #ffca28;
            border-radius: 50%;
            pointer-events: none;
            z-index: 2;
            animation: spark-fly 0.8s ease-out forwards;
            box-shadow: 0 0 10px #ff6b35, 0 0 20px #ffa500;
        }
        
        @keyframes spark-fly {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--dx), calc(var(--dy) - 50px)) scale(0); opacity: 0; }
        }
        
        .ember {
            position: absolute;
            width: 3px;
            height: 3px;
            background: radial-gradient(circle, #ff6b35 0%, #ff4500 50%, transparent 100%);
            border-radius: 50%;
            animation: emberRise 3s ease-out infinite;
        }
        
        @keyframes emberRise {
            0% { transform: translateY(0) scale(1); opacity: 0.8; }
            100% { transform: translateY(-200px) scale(0.3); opacity: 0; }
        }
        
        .flame {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 100px;
            background: linear-gradient(0deg, rgba(255, 100, 0, 0.3) 0%, transparent 100%);
            filter: blur(10px);
            animation: flameFlicker 0.5s ease-in-out infinite;
        }
        
        @keyframes flameFlicker {
            0%, 100% { opacity: 0.5; transform: scaleY(1); }
            50% { opacity: 0.8; transform: scaleY(1.1); }
        }
    </style>
</head>
<body>
    <a href="../../index.html" style="position: fixed; top: 20px; right: 30px; font-size: 40px; color: white; text-decoration: none; z-index: 10000;" onclick="event.preventDefault(); playCloseSound(); setTimeout(() => window.location.href='../../index.html', 200);">&times;</a>
    <div class="title">ARROZ</div>
    <div class="flame"></div>
    <div class="rice-container" id="container"></div>
    
    <script>
        function playCloseSound() {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            oscillator.frequency.setValueAtTime(600, audioContext.currentTime);
            oscillator.frequency.linearRampToValueAtTime(400, audioContext.currentTime + 0.15);
            gainNode.gain.setValueAtTime(0.2, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.15);
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.15);
        }
        
        const container = document.getElementById('container');
        const grainCount = 150;
        
        function createGrain() {
            const grain = document.createElement('div');
            grain.className = 'grain';
            const startX = Math.random() * window.innerWidth;
            grain.style.left = startX + 'px';
            const duration = 3 + Math.random() * 3;
            const delay = Math.random() * 5;
            const scale = 0.5 + Math.random() * 0.8;
            grain.style.transform = `scale(${scale})`;
            grain.style.animationDuration = duration + 's';
            grain.style.animationDelay = delay + 's';
            
            grain.addEventListener('animationend', () => {
                grain.remove();
                createGrain();
            });
            
            container.appendChild(grain);
            
            const sparkInterval = setInterval(() => {
                const rect = grain.getBoundingClientRect();
                if (rect.top > window.innerHeight * 0.3 && rect.top < window.innerHeight * 0.7) {
                    if (Math.random() > 0.5) {
                        createSpark(rect.left + rect.width/2, rect.top + rect.height/2);
                    }
                }
                if (rect.top > window.innerHeight) {
                    clearInterval(sparkInterval);
                }
            }, 150);
            
            grain.addEventListener('remove', () => clearInterval(sparkInterval));
        }
        
        function createSpark(x, y) {
            const spark = document.createElement('div');
            spark.className = 'spark';
            spark.style.left = x + 'px';
            spark.style.top = y + 'px';
            const dx = (Math.random() - 0.5) * 80;
            const dy = (Math.random() - 0.5) * 80 - 30;
            spark.style.setProperty('--dx', dx + 'px');
            spark.style.setProperty('--dy', dy + 'px');
            document.body.appendChild(spark);
            setTimeout(() => spark.remove(), 800);
        }
        
        function createEmber() {
            const ember = document.createElement('div');
            ember.className = 'ember';
            ember.style.left = Math.random() * window.innerWidth + 'px';
            ember.style.bottom = '0px';
            ember.style.animationDuration = (Math.random() * 2 + 2) + 's';
            ember.style.animationDelay = Math.random() * 2 + 's';
            document.body.appendChild(ember);
            setTimeout(() => ember.remove(), 4000);
        }
        
        for (let i = 0; i < grainCount; i++) {
            createGrain();
        }
        
        setInterval(createEmber, 200);
        
        window.addEventListener('resize', () => {});
    </script>
</body>
</html>
