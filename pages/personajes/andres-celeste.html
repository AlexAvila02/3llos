<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Andres Celeste</title>
  <style>
    body {
      background: linear-gradient(180deg, #87CEFA 0%, #00BFFF 30%, #1E90FF 70%, #4169E1 100%);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: 'Arial Black', sans-serif;
      font-size: 120px;
      position: relative;
      overflow: hidden;
    }
    
    .title {
      position: relative;
      z-index: 10;
      animation: skyPulse 3s ease-in-out infinite;
      text-shadow: 0 0 30px rgba(255,255,255,0.8);
    }
    
    @keyframes skyPulse {
      0%, 100% { transform: scale(1); text-shadow: 0 0 30px rgba(255,255,255,0.5); }
      50% { transform: scale(1.05); text-shadow: 0 0 50px rgba(255,255,255,1), 0 0 100px rgba(135,206,250,0.8); }
    }
    
    .cloud {
      position: absolute;
      background: rgba(255, 255, 255, 0.8);
      border-radius: 100px;
      animation: cloudFloat linear infinite;
    }
    
    @keyframes cloudFloat {
      0% { transform: translateX(-300px); }
      100% { transform: translateX(calc(100vw + 300px)); }
    }
    
    .raindrop {
      position: absolute;
      width: 2px;
      height: 20px;
      background: linear-gradient(to bottom, transparent, rgba(135, 206, 250, 0.6));
      animation: rainfall 1s linear infinite;
    }
    
    @keyframes rainfall {
      0% { transform: translateY(-100px); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(100vh); opacity: 0; }
    }
    
    .bird {
      position: absolute;
      font-size: 30px;
      animation: birdFly 15s linear infinite;
    }
    
    @keyframes birdFly {
      0% { transform: translateX(-100px) scale(1); }
      50% { transform: translateX(50vw) scale(0.8); }
      100% { transform: translateX(calc(100vw + 100px)) scale(1); }
    }
    
    .sun-ray {
      position: absolute;
      width: 2px;
      height: 200px;
      background: linear-gradient(to bottom, rgba(255,255,200,0.6), transparent);
      transform-origin: top center;
      animation: rayRotate 20s linear infinite;
    }
    
    @keyframes rayRotate {
      0% { transform: rotate(-30deg); opacity: 0.5; }
      50% { transform: rotate(0deg); opacity: 0.8; }
      100% { transform: rotate(30deg); opacity: 0.5; }
    }
    
    .rainbow {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 500px;
      height: 250px;
      border-radius: 50% 50% 0 0;
      background: linear-gradient(
        180deg,
        #ff0000 0%,
        #ff7f00 14%,
        #ffff00 28%,
        #00ff00 42%,
        #0000ff 56%,
        #4b0082 70%,
        #9400d3 84%,
        transparent 100%
      );
      opacity: 0.4;
      animation: rainbowFade 5s ease-in-out infinite;
    }
    
    @keyframes rainbowFade {
      0%, 100% { opacity: 0.3; transform: translate(-50%, -50%) scale(1); }
      50% { opacity: 0.5; transform: translate(-50%, -50%) scale(1.1); }
    }
  </style>
</head>
<body>
  <a href="../../index.html" style="position: fixed; top: 20px; right: 30px; font-size: 40px; color: white; text-decoration: none; z-index: 10000;" onclick="event.preventDefault(); playCloseSound(); setTimeout(() => window.location.href='../../index.html', 200);">&times;</a>
  
  <div class="rainbow"></div>
  <div class="title">☁️ Andres ☁️</div>
  
  <script>
    function createCloud() {
      const cloud = document.createElement('div');
      cloud.className = 'cloud';
      cloud.style.width = (Math.random() * 150 + 80) + 'px';
      cloud.style.height = (Math.random() * 50 + 30) + 'px';
      cloud.style.top = Math.random() * 40 + '%';
      cloud.style.animationDuration = (Math.random() * 10 + 20) + 's';
      document.body.appendChild(cloud);
      setTimeout(() => cloud.remove(), 30000);
    }
    
    function createRaindrop() {
      const drop = document.createElement('div');
      drop.className = 'raindrop';
      drop.style.left = Math.random() * window.innerWidth + 'px';
      drop.style.animationDuration = (Math.random() * 0.5 + 0.5) + 's';
      drop.style.animationDelay = Math.random() * 0.5 + 's';
      document.body.appendChild(drop);
      setTimeout(() => drop.remove(), 1000);
    }
    
    function createBird() {
      const bird = document.createElement('div');
      bird.className = 'bird';
      bird.textContent = '🕊️';
      bird.style.top = Math.random() * 40 + '%';
      bird.style.animationDuration = (Math.random() * 10 + 10) + 's';
      document.body.appendChild(bird);
      setTimeout(() => bird.remove(), 20000);
    }
    
    function createSunRay() {
      const ray = document.createElement('div');
      ray.className = 'sun-ray';
      ray.style.left = (Math.random() * window.innerWidth) + 'px';
      ray.style.animationDuration = (Math.random() * 10 + 15) + 's';
      document.body.appendChild(ray);
      setTimeout(() => ray.remove(), 25000);
    }
    
    for(let i = 0; i < 8; i++) createCloud();
    for(let i = 0; i < 3; i++) createBird();
    for(let i = 0; i < 5; i++) createSunRay();
    
    setInterval(createCloud, 5000);
    setInterval(createRaindrop, 20);
    setInterval(createBird, 8000);
    
    function playCloseSound() {
      const audioContext = new (window.AudioContext || window.webkitAudioContext)();
      const oscillator = audioContext.createOscillator();
      const gainNode = audioContext.createGain();
      oscillator.connect(gainNode);
      gainNode.connect(audioContext.destination);
      oscillator.frequency.setValueAtTime(600, audioContext.currentTime);
      oscillator.frequency.linearRampToValueAtTime(400, audioContext.currentTime + 0.15);
      gainNode.gain.setValueAtTime(0.2, audioContext.currentTime);
      gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.15);
      oscillator.start(audioContext.currentTime);
      oscillator.stop(audioContext.currentTime + 0.15);
    }
  </script>
</body>
</html>
