<!DOCTYPE html>
<html lang="es">
<head>
    <title>Primito</title>
    <style>
        body {
            background: linear-gradient(135deg, #8B4513 0%, #D2691E 50%, #CD853F 100%);
            color: #FFF8DC;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-size: 100px;
            margin: 0;
            font-family: 'Courier New', monospace;
            position: relative;
            overflow: hidden;
        }
        
        .title {
            position: relative;
            z-index: 10;
            animation: primitivePulse 2s ease-in-out infinite;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.5);
        }
        
        @keyframes primitivePulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }
        
        .fire-particle {
            position: absolute;
            width: 6px;
            height: 6px;
            background: radial-gradient(circle, #ff6b35 0%, #f7931e 50%, transparent 100%);
            border-radius: 50%;
            animation: fireRise 2s ease-out infinite;
        }
        
        @keyframes fireRise {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-150px) scale(0.3); opacity: 0; }
        }
        
        .tribal-pattern {
            position: absolute;
            font-size: 40px;
            opacity: 0.3;
            animation: patternRotate 10s linear infinite;
        }
        
        @keyframes patternRotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .spear {
            position: absolute;
            font-size: 60px;
            animation: spearFloat 3s ease-in-out infinite;
        }
        
        @keyframes spearFloat {
            0%, 100% { transform: translateY(0) rotate(-5deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }
        
        .cave-painting {
            position: absolute;
            width: 80px;
            height: 60px;
            background: rgba(139, 69, 19, 0.4);
            border-radius: 10px;
            animation: paintingFade 4s ease-in-out infinite;
        }
        
        @keyframes paintingFade {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.7; }
        }
        
        .ember {
            position: absolute;
            width: 3px;
            height: 3px;
            background: #ff4500;
            border-radius: 50%;
            animation: emberFloat 3s ease-in-out infinite;
        }
        
        @keyframes emberFloat {
            0%, 100% { transform: translate(0, 0); opacity: 0.5; }
            50% { transform: translate(30px, -50px); opacity: 1; }
        }
    </style>
</head>
<body>
    <a href="../../index.html" style="position: fixed; top: 20px; right: 30px; font-size: 40px; color: #FFF8DC; text-decoration: none; z-index: 10000;" onclick="event.preventDefault(); playCloseSound(); setTimeout(() => window.location.href='../../index.html', 200);">&times;</a>
    
    <div class="title">🏹 Primito 🏹</div>
    
    <script>
        // Crear partículas de fuego
        function createFireParticle() {
            const particle = document.createElement('div');
            particle.className = 'fire-particle';
            particle.style.left = (Math.random() * window.innerWidth) + 'px';
            particle.style.bottom = '50px';
            particle.style.animationDelay = Math.random() * 2 + 's';
            document.body.appendChild(particle);
            setTimeout(() => particle.remove(), 2000);
        }
        
        // Crear patrones tribales
        function createTribalPattern() {
            const pattern = document.createElement('div');
            pattern.className = 'tribal-pattern';
            const symbols = ['◆', '▲', '▼', '●', '◐', '◑'];
            pattern.textContent = symbols[Math.floor(Math.random() * symbols.length)];
            pattern.style.left = Math.random() * window.innerWidth + 'px';
            pattern.style.top = Math.random() * window.innerHeight + 'px';
            pattern.style.animationDuration = (Math.random() * 5 + 5) + 's';
            document.body.appendChild(pattern);
        }
        
        // Crear lanzas
        function createSpear() {
            const spear = document.createElement('div');
            spear.className = 'spear';
            spear.textContent = '🎯';
            spear.style.left = Math.random() * window.innerWidth + 'px';
            spear.style.top = (Math.random() * window.innerHeight * 0.5) + 'px';
            spear.style.animationDelay = Math.random() * 2 + 's';
            document.body.appendChild(spear);
        }
        
        // Crear pinturas rupestres
        function createCavePainting() {
            const painting = document.createElement('div');
            painting.className = 'cave-painting';
            painting.style.left = Math.random() * window.innerWidth + 'px';
            painting.style.top = Math.random() * window.innerHeight + 'px';
            painting.style.animationDelay = Math.random() * 2 + 's';
            document.body.appendChild(painting);
        }
        
        // Crear brasas
        function createEmber() {
            const ember = document.createElement('div');
            ember.className = 'ember';
            ember.style.left = Math.random() * window.innerWidth + 'px';
            ember.style.top = Math.random() * window.innerHeight + 'px';
            ember.style.animationDelay = Math.random() * 2 + 's';
            document.body.appendChild(ember);
        }
        
        // Inicializar elementos
        for(let i = 0; i < 8; i++) createTribalPattern();
        for(let i = 0; i < 5; i++) createSpear();
        for(let i = 0; i < 6; i++) createCavePainting();
        for(let i = 0; i < 20; i++) createEmber();
        
        // Generar fuego periódicamente
        setInterval(createFireParticle, 100);
        
        function playCloseSound() {
          const audioContext = new (window.AudioContext || window.webkitAudioContext)();
          const oscillator = audioContext.createOscillator();
          const gainNode = audioContext.createGain();
          oscillator.connect(gainNode);
          gainNode.connect(audioContext.destination);
          oscillator.frequency.setValueAtTime(600, audioContext.currentTime);
          oscillator.frequency.linearRampToValueAtTime(400, audioContext.currentTime + 0.15);
          gainNode.gain.setValueAtTime(0.2, audioContext.currentTime);
          gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.15);
          oscillator.start(audioContext.currentTime);
          oscillator.stop(audioContext.currentTime + 0.15);
        }
    </script>
</body>
</html>
