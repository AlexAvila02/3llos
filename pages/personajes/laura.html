<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Laura</title>
  <style>
    body {
      background: linear-gradient(180deg, #ffb6c1 0%, #ffc0cb 50%, #ffe4e1 100%);
      color: #8b008b;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: 'Brush Script MT', cursive;
      font-size: 120px;
      position: relative;
      overflow: hidden;
    }
    
    .title {
      position: relative;
      z-index: 10;
      animation: flowerSway 4s ease-in-out infinite;
      text-shadow: 2px 2px 4px rgba(255,182,193,0.8);
    }
    
    @keyframes flowerSway {
      0%, 100% { transform: rotate(-2deg) translateY(0); }
      50% { transform: rotate(2deg) translateY(-10px); }
    }
    
    .flower {
      position: absolute;
      font-size: 40px;
      animation: flowerFloat 6s ease-in-out infinite;
      opacity: 0.8;
    }
    
    @keyframes flowerFloat {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-30px) rotate(20deg); }
    }
    
    .petal {
      position: absolute;
      width: 15px;
      height: 15px;
      background: radial-gradient(circle, #ffb6c1 0%, #ff69b4 100%);
      border-radius: 50% 0 50% 50%;
      animation: petalFall 8s linear infinite;
    }
    
    @keyframes petalFall {
      0% { transform: translateY(-100px) rotate(0deg) translateX(0); opacity: 1; }
      100% { transform: translateY(100vh) rotate(360deg) translateX(50px); opacity: 0; }
    }
    
    .heart {
      position: absolute;
      font-size: 25px;
      animation: heartPulse 2s ease-in-out infinite;
      opacity: 0.6;
    }
    
    @keyframes heartPulse {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.3); opacity: 1; }
    }
    
    .butterfly {
      position: absolute;
      font-size: 35px;
      animation: butterflyFly 10s linear infinite;
    }
    
    @keyframes butterflyFly {
      0% { transform: translate(0, 0) rotate(0deg); }
      25% { transform: translate(200px, -100px) rotate(20deg); }
      50% { transform: translate(400px, 0) rotate(0deg); }
      75% { transform: translate(200px, 100px) rotate(-20deg); }
      100% { transform: translate(0, 0) rotate(0deg); }
    }
  </style>
</head>
<body>
  <a href="../../index.html" style="position: fixed; top: 20px; right: 30px; font-size: 40px; color: #8b008b; text-decoration: none; z-index: 10000;" onclick="event.preventDefault(); playCloseSound(); setTimeout(() => window.location.href='../../index.html', 200);">&times;</a>
  
  <div class="title">🌸 Laura 🌸</div>
  
  <script>
    function createFlower() {
      const flower = document.createElement('div');
      flower.className = 'flower';
      const flowers = ['🌸', '🌺', '🌻', '🌷', '🌹', '🌼', '🌿'];
      flower.textContent = flowers[Math.floor(Math.random() * flowers.length)];
      flower.style.left = Math.random() * window.innerWidth + 'px';
      flower.style.top = Math.random() * window.innerHeight + 'px';
      flower.style.animationDelay = Math.random() * 2 + 's';
      document.body.appendChild(flower);
    }
    
    function createPetal() {
      const petal = document.createElement('div');
      petal.className = 'petal';
      petal.style.left = Math.random() * window.innerWidth + 'px';
      petal.style.animationDuration = (Math.random() * 5 + 5) + 's';
      petal.style.animationDelay = Math.random() * 3 + 's';
      document.body.appendChild(petal);
      setTimeout(() => petal.remove(), 10000);
    }
    
    function createHeart() {
      const heart = document.createElement('div');
      heart.className = 'heart';
      heart.textContent = '💖';
      heart.style.left = Math.random() * window.innerWidth + 'px';
      heart.style.top = Math.random() * window.innerHeight + 'px';
      heart.style.animationDelay = Math.random() * 2 + 's';
      document.body.appendChild(heart);
    }
    
    function createButterfly() {
      const butterfly = document.createElement('div');
      butterfly.className = 'butterfly';
      butterfly.textContent = '🦋';
      butterfly.style.left = Math.random() * window.innerWidth * 0.5 + 'px';
      butterfly.style.top = Math.random() * window.innerHeight * 0.5 + 'px';
      butterfly.style.animationDuration = (Math.random() * 5 + 8) + 's';
      document.body.appendChild(butterfly);
    }
    
    for(let i = 0; i < 15; i++) createFlower();
    for(let i = 0; i < 20; i++) createHeart();
    for(let i = 0; i < 3; i++) createButterfly();
    
    setInterval(createPetal, 1000);
    
    function playCloseSound() {
      const audioContext = new (window.AudioContext || window.webkitAudioContext)();
      const oscillator = audioContext.createOscillator();
      const gainNode = audioContext.createGain();
      oscillator.connect(gainNode);
      gainNode.connect(audioContext.destination);
      oscillator.frequency.setValueAtTime(600, audioContext.currentTime);
      oscillator.frequency.linearRampToValueAtTime(400, audioContext.currentTime + 0.15);
      gainNode.gain.setValueAtTime(0.2, audioContext.currentTime);
      gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.15);
      oscillator.start(audioContext.currentTime);
      oscillator.stop(audioContext.currentTime + 0.15);
    }
  </script>
</body>
</html>
